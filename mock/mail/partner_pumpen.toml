[[doc]]
key = "p4_verzug"
file = "Aquatec_Mitteilung_Lieferverzug_Auftrag_P-5102.pdf"
title = "Mitteilung über die Verschiebung des Liefertermins, Auftrag P-5102"
text = """An: Acme Tiefbau GmbH, Herrn John Doe, Schnackenburgallee 114, 22525 Hamburg
Projekt: Abwasserpumpwerk Deichstraße, Stadt Norderbek
Ihr Auftrag vom {-139}, unsere Auftragsbestätigung vom {-137}

Sehr geehrter Herr Doe,

zu unserem Bedauern müssen wir Ihnen mitteilen, dass wir den mit Auftragsbestätigung vom {-137} genannten Liefertermin KW {kw-58} für die beiden Tauchmotorpumpen AT 100-28 Ex (Position 2.2.20) nicht einhalten können.

Ursache: Die explosionsgeschützten Motoren der Leistungsstufe 7,5 kW werden von unserem Vorlieferanten bezogen. Dieser hat uns am {-69} mitgeteilt, dass die Motoren dieser Baureihe wegen eines Engpasses bei den druckfest gekapselten Gehäusen derzeit nicht verfügbar sind. Betroffen ist die gesamte Baureihe, nicht nur Ihr Auftrag. Eine Lieferung aus anderen Quellen ist wegen der Baumusterprüfung der Ex-Ausführung nicht zulässig.

Neuer Liefertermin: KW {kw+2}. Dieser Termin beruht auf der schriftlichen Zusage des Vorlieferanten.

Nicht betroffen sind die Schaltanlage (Aufstellung wie geplant in KW {kw-52}), die Füllstandsmessung sowie Kupplungsfüße und Führungsrohre, die bereits geliefert sind.

Wir sind uns bewusst, dass Ihnen aus der Verschiebung Nachteile entstehen können, und werden Ihnen kurzfristig einen Vorschlag zur Überbrückung unterbreiten.

Aquatec Pumpen und Anlagenbau GmbH
Projektvertrieb Abwassertechnik
Dr.-Ing. Ralf Behrens"""

[[doc]]
key = "p4_bestaetigung"
file = "Aquatec_Bestaetigung_Leihpumpen_und_Liefertermin_P-5102.pdf"
title = "Bestätigung: Leihpumpen und verbindlicher Liefertermin, Auftrag P-5102"
text = """An: Acme Tiefbau GmbH, Herrn John Doe
Zur Vorlage bei der Stadt Norderbek, Fachdienst Tiefbau, Herrn Dipl.-Ing. Hartwig
Projekt: Abwasserpumpwerk Deichstraße

1. Leihpumpen
Wir stellen ab KW {kw-48} zwei Tauchmotorpumpen AT 100-24 Ex als Leihgeräte kostenfrei zur Verfügung, einschließlich An- und Abtransport. Daten: Motor 5,5 kW, 400 V, explosionsgeschützt (Zone 1), Einkanalrad, freier Durchgang 100 mm, Betriebspunkt 24 l/s bei 14 m. Die Pumpen gehören zur selben Baureihe wie die bestellten und passen ohne Umbau auf die eingebauten Kupplungsfüße DN 100 und Führungsrohre. Kennlinien und die EU-Baumusterprüfbescheinigung der Ex-Ausführung liegen dieser Bestätigung bei.

2. Liefertermin der bestellten Pumpen
Die beiden Tauchmotorpumpen AT 100-28 Ex, 7,5 kW, werden in KW {kw+2} auf die Baustelle geliefert. Diesen Termin bestätigen wir verbindlich.

3. Austausch
Der Austausch erfolgt Pumpe für Pumpe ohne Unterbrechung des Betriebs. Unser Servicetechniker ist beim Austausch anwesend und nimmt die Parametrierung von Motorschutz und Sanftanlauf auf 7,5 kW vor.

4. Gewährleistung
Die Gewährleistungsfrist für die bestellten Pumpen beginnt mit der Abnahme nach dem Probebetrieb, nicht mit dem Einbau der Leihpumpen.

Aquatec Pumpen und Anlagenbau GmbH
Dr.-Ing. Ralf Behrens"""

