Annahmen: Zufluss bis 2 l/s, Druckleitung da 63, Länge bis 400 m, Förderhöhe bis 18 m. Zwei Pumpen mit Schneideinrichtung, je 1,5 kW, 2,5 l/s bei 18 m, im Wechselbetrieb. Schacht aus PE mit Auftriebskragen, Abdeckung Klasse B 125, Verrohrung Edelstahl DN 40.
Dies ist kein verbindliches Angebot. Ein verbindliches Angebot erstellen wir nach Vorlage von Lageplan, Höhen, Leitungslänge und Grundwasserstand. Die Richtpreise gelten für Lieferungen bis {+40}; danach ist mit einer Anpassung von etwa 4 % zu rechnen.
