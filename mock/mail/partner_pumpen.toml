body = """Sehr geehrte Damen und Herren,

die Acme Tiefbau GmbH bietet einem Generalunternehmer die Entwässerung und die Außenanlagen für den Neubau einer Logistikhalle in Tornesch an (privater Bauherr, keine öffentliche Vergabe). Dazu gehört eine kleine Schmutzwasserpumpstation, für die wir Ihr Angebot erbitten:

Pos. 1.10 – 1 St – Fertigpumpstation DN 1500 mit zwei Tauchmotorpumpen, Schachttiefe 3,60 m, Zufluss 6 l/s, Druckleitung PE da 90, Länge 210 m, geodätische Höhe 4,5 m
Pos. 1.20 – 1 St – Schaltgerät für Doppelpumpwerk mit Störmeldung über Mobilfunk

Bitte nennen Sie Preis, Fabrikat und Typ, Lieferzeit und den Umfang dessen, was bauseits zu leisten ist. Die Positionen liegen als Excel-Datei bei. Wir geben unser Angebot am {-340} ab und benötigen Ihres bis {-344}.

Wir arbeiten bisher nicht zusammen; Sie wurden uns vom Betriebsleiter einer Kläranlage empfohlen.

Mit freundlichen Grüßen"""
attach = ["sheet:halle:blank"]

[[mail]]
id = "halle_angebot"
day = -346
time = "16:20"
from = "pumpen"
to = "us"
subject = "AW: Preisanfrage – Fertigpumpstation für Schmutzwasser – Neubau Logistikhalle Tornesch – Angebot P-4471"
reply_to = "halle_anfrage"
body = """Sehr geehrter Herr Doe,

vielen Dank für Ihre Anfrage und für die Empfehlung. Ich bin im Projektvertrieb Abwassertechnik für Schleswig-Holstein und Hamburg zuständig und künftig Ihr Ansprechpartner.

Unser Angebot P-4471 erhalten Sie als PDF im Anhang. Zur Auslegung einige Erläuterungen, damit Sie es mit anderen Angeboten vergleichen können:

1. Aus Ihren Angaben (6 l/s Zufluss, 210 m Druckleitung da 90, 4,5 m geodätische Höhe) ergibt sich bei einer Mindestfließgeschwindigkeit von 0,7 m/s ein Betriebspunkt von rund 9 l/s bei 8 m Förderhöhe. Darauf sind die beiden Pumpen AT 80-9 mit je 2,2 kW ausgelegt. Eine Pumpe fördert den gesamten Zufluss, die zweite ist Reserve; sie laufen im Wechsel.
2. Der freie Durchgang beträgt 80 mm. Für eine Logistikhalle mit Sozialräumen ist das angemessen; Schneidradpumpen wären billiger, verstopfen bei Feuchttüchern jedoch erfahrungsgemäß.
3. Der Schacht ist aus PE mit Auftriebskragen. Ob der Auftrieb bei Ihrem Grundwasserstand nachzuweisen ist, bitte ich Sie zu prüfen; den Nachweis erstellen wir auf Wunsch.

Die Excel-Datei habe ich nicht ausgefüllt, da eine Station aus mehreren Komponenten in zwei Zeilen nicht sachgerecht darstellbar ist.

Für technische Rückfragen stehe ich Ihnen jederzeit zur Verfügung."""
