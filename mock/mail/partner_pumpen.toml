subject = "Pumpwerk Deichstraße, Auftrag P-5102 – Pumpen 7,5 kW im Werk eingetroffen, Tausch in KW {kw+2}"
body = """Sehr geehrter Herr Doe, sehr geehrter Herr Albers,

ich kann Ihnen den zugesagten Termin bestätigen: Die beiden Ex-Motoren 7,5 kW sind bei uns im Werk eingetroffen, die Pumpen AT 100-28 Ex sind montiert und durchlaufen heute und morgen die Endprüfung (Kennlinienmessung, Isolations- und Dichtheitsprüfung). Die Prüfprotokolle erhalten Sie mit der Lieferung.

Ablauf des Tauschs in KW {kw+2}, vorbehaltlich Ihrer Zustimmung:
1. Anlieferung der Pumpen am ersten Tag bis 8:00 Uhr, zusammen mit unserem Servicetechniker Herrn Wulf.
2. Tausch der Pumpe 2 (die Leihpumpe mit dem rauen Anlauf, den Herr Albers gemeldet hat), Parametrierung dieses Abgangs auf 7,5 kW, Probelauf. Währenddessen fördert Pumpe 1.
3. Am Folgetag Tausch der Pumpe 1, danach Parallelbetrieb beider Pumpen und Messung des Betriebspunkts.
4. Rücknahme der Leihpumpen mit demselben Fahrzeug.

Den genauen Tag stimme ich morgen telefonisch mit Herrn Albers ab, damit der Betrieb der Stadt den Saugwagen bereitstellen kann. Mit dem Abschluss des Tauschs kann der 14-tägige Probebetrieb beginnen.

Zwei weitere Punkte:
- Die zugesagte Gutschrift über 2.400,00 EUR netto verrechnen wir mit der Schlussrate.
- Ihr Richtpreisangebot R-0718 für die Kleinpumpstation ist noch offen. Die Richtpreise gelten für Lieferungen bis {+40}; zum Jahreswechsel passen wir die Preise für Kleinstationen um etwa 4 % an. Sobald Ihr Auftraggeber sich entschieden hat und Lageplan und Höhen vorliegen, erstelle ich das verbindliche Angebot.

Am Fachtag Abwasserpumpwerke bei uns in Bargteheide würde ich mich freuen, Sie beide zu begrüßen."""
