time = "15:35"
from = "pumpen"
to = "us"
cc = ["us.albers"]
subject = "Auftrag P-5102 Pumpwerk Deichstraße – Verschiebung des Liefertermins der Tauchmotorpumpen auf KW {kw+2}"
body = """Sehr geehrter Herr Doe, sehr geehrter Herr Albers,

ich muss Ihnen heute eine Nachricht übermitteln, die ich Ihnen gern erspart hätte. Das förmliche Schreiben finden Sie im Anhang; hier das Wesentliche.

Die beiden Tauchmotorpumpen AT 100-28 Ex können nicht wie bestätigt in KW {kw-58} geliefert werden. Die explosionsgeschützten Motoren der Leistungsstufe 7,5 kW sind bei unserem Vorlieferanten nicht verfügbar. Der Engpass betrifft die druckfest gekapselten Gehäuse und damit die gesamte Baureihe. Neuer Liefertermin ist KW {kw+2}; hierfür liegt mir die schriftliche Zusage des Vorlieferanten vor.

Ein Ausweichen auf Motoren anderer Herkunft ist nicht möglich: Die EU-Baumusterprüfbescheinigung der Ex-Ausführung gilt für die Kombination aus Pumpe und diesem Motor. Eine Pumpe ohne gültige Bescheinigung dürften Sie in Zone 1 nicht einbauen, und der Betreiber dürfte sie nicht abnehmen.

Nicht betroffen: Die Schaltanlage wird wie geplant in KW {kw-52} aufgestellt. Kupplungsfüße, Führungsrohre und Füllstandsmessung sind geliefert und montiert.

Mir ist bewusst, was dieser Termin für Ihre Einzelfrist am {-40} bedeutet. Ich prüfe derzeit mit unserem Mietpark und dem Service, wie wir den Zeitraum überbrücken können, und melde mich dazu in den nächsten Tagen mit einem konkreten Vorschlag."""
attach = ["doc:p4_verzug"]

[[mail]]
id = "p4_verzug_aw"
day = -66
time = "17:20"
from = "us"
to = "pumpen"
cc = ["us.albers"]
subject = "AW: Auftrag P-5102 Pumpwerk Deichstraße – Verschiebung des Liefertermins der Tauchmotorpumpen auf KW {kw+2}"
reply_to = "p4_verzug"
body = """Sehr geehrter Herr Dr. Behrens,

Ihre Mitteilung haben wir erhalten. Dass der Engpass beim Vorlieferanten liegt, nehmen wir zur Kenntnis; an unserer Lage ändert es nichts. Sie haben den Termin KW {kw-58} am {-137} bestätigt, und wir haben ihn so an die Stadt weitergegeben.

Zur Einordnung: Die Einzelfrist am {-40} ist Vertragsfrist mit Vertragsstrafe. Das alte Pumpwerk läuft nach Auskunft der Stadt nur noch mit einer Pumpe ohne Reserve und soll keinen weiteren Winter in Betrieb bleiben. Herr Albers hat der Stadt heute vorsorglich Behinderung angezeigt; wir rechnen damit, dass die Stadt sie zurückweist, weil der Verzug aus unserer Sphäre kommt.

Wir brauchen deshalb bis spätestens {-62} von Ihnen eine Lösung, mit der das Pumpwerk zur Nacht zum {-42} fördert. Konkret fragen wir:

1. Können Sie Leihpumpen stellen, die auf die eingebauten Kupplungsfüße passen, in Ex-Ausführung, mit der nächstkleineren oder nächstgrößeren Motorleistung, für die Motoren verfügbar sind?
2. Wer trägt Miete, Transport, den zweimaligen Ein- und Ausbau und die zweite Parametrierung der Schaltanlage?
3. Bestätigen Sie den neuen Termin KW {kw+2} verbindlich?

Ich bin morgen ab 7:30 Uhr telefonisch erreichbar.

Mit freundlichen Grüßen"""

[[mail]]
id = "p4_leihpumpen"
day = -62
time = "10:10"
from = "pumpen"
to = "us"
cc = ["us.albers"]
subject = "Auftrag P-5102 Pumpwerk Deichstraße – Vorschlag: zwei Leihpumpen 5,5 kW Ex ab KW {kw-48}"
reply_to = "p4_verzug_aw"
body = """Sehr geehrter Herr Doe,

wie gestern telefonisch besprochen, bestätige ich unseren Vorschlag schriftlich.

1. Leihpumpen. Wir stellen Ihnen ab KW {kw-48} zwei Tauchmotorpumpen derselben Baureihe mit dem nächstkleineren Motor zur Verfügung: AT 100-24 Ex, 5,5 kW, explosionsgeschützt für Zone 1, 24 l/s bei 14 m. Motoren dieser Leistungsstufe sind vom Engpass nicht betroffen; die Pumpen stammen aus unserem Mietpark. Sie passen ohne Umbau auf die eingebauten Kupplungsfüße DN 100 und die Führungsrohre.

2. Hydraulik. Der Trockenwetterzufluss beträgt nach den Unterlagen 11 l/s. Eine Leihpumpe fördert 24 l/s, die zweite steht als Reserve bereit; bei Regenwetter laufen beide parallel und fördern zusammen rund 34 l/s. Gegenüber der endgültigen Ausrüstung fehlen im Parallelbetrieb etwa 5 l/s. Für einen Zeitraum von wenigen Wochen halte ich das für vertretbar; die Entscheidung liegt beim Betreiber.

3. Kosten. Miete sowie An- und Abtransport der Leihpumpen tragen wir. Den zweimaligen Aus- und Einbau und die zweite Parametrierung bitte ich Sie zunächst selbst zu veranschlagen; über eine Beteiligung sprechen wir, wenn die Zahlen vorliegen. Unser Servicetechniker kommt zum Einbau der Leihpumpen und zum späteren Austausch ohne Berechnung.

4. Schaltanlage. Motorschutz und Sanftanlauf werden für 5,5 kW parametriert und beim Austausch auf 7,5 kW umgestellt. An der Hardware ändert sich nichts.

5. Liefertermin. KW {kw+2} für die endgültigen Pumpen bestätige ich; eine förmliche Bestätigung zur Vorlage bei der Stadt erstelle ich, sobald Sie mir mitteilen, dass die Stadt dem Vorgehen zustimmt.

Der Austausch kann Pumpe für Pumpe im laufenden Betrieb erfolgen."""

