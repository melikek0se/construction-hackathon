Ich habe folgende Annahmen getroffen, die Sie Ihrem Auftraggeber bitte mitteilen: Zufluss bis 2 l/s, Druckleitung da 63 mit bis zu 400 m Länge, Förderhöhe bis 18 m. Bei einer so kleinen Nennweite sind Pumpen mit Schneideinrichtung erforderlich; anders als bei der Logistikhalle in Tornesch, wo ich davon abgeraten hatte, gibt es hier keine sinnvolle Alternative. Ihr Auftraggeber sollte wissen, dass Schneidwerke Verschleißteile sind und etwa alle drei bis fünf Jahre getauscht werden.

Für die Tiefbauarbeiten (Aushub, Versetzen, Auftriebssicherung, Elektrozuleitung) rechnen andere Kunden erfahrungsgemäß mit dem Zwei- bis Dreifachen des Stationspreises; das können Sie besser beurteilen als ich.

