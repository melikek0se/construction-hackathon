file = "Aufforderung_zur_Angebotsabgabe_TBA-2026-114.pdf"
title = "Aufforderung zur Abgabe eines Angebots"
from = "tba"
text = """Vergabenummer: TBA-2026-114
Maßnahme: Erneuerung Mischwasserkanal Birkenweg, 2. BA
Leistung: Kanal- und Straßenbauarbeiten
Vergabeart: Öffentliche Ausschreibung nach VOB/A, Abschnitt 1

Sehr geehrte Damen und Herren,

die Stadt Norderbek beabsichtigt, die oben genannte Leistung im Namen und für Rechnung des Eigenbetriebs Stadtentwässerung zu vergeben. Wir fordern Sie auf, ein Angebot abzugeben.

Termine
Ablauf der Angebotsfrist | {+14|long}, 10:00 Uhr
Eröffnungstermin | {+14}, 10:00 Uhr, Rathaus, Raum 2.14
Bieterfragen bis | {+7}
Ablauf der Bindefrist | {+60}
Ausführungsbeginn | {+95}
Fertigstellung | {+250}

Umfang der Leistung
ca. 310 m Mischwasserkanal DN 300 bis DN 400 in offener Bauweise, Tiefe bis 3,50 m
8 Schachtbauwerke DN 1000
34 Anschlussleitungen DN 150, zusammen ca. 270 m
ca. 860 m2 Wiederherstellung der Fahrbahn in Asphaltbauweise, ca. 240 m2 Pflaster

Form der Angebote
Angebote sind in Textform über den Vergabemarktplatz Nord oder schriftlich im verschlossenen Umschlag einzureichen. Das Leistungsverzeichnis ist als GAEB-Datei (DA 84) und als unterschriebener Ausdruck des Angebotsschreibens (Formblatt 213) abzugeben. Nebenangebote sind nur in Verbindung mit einem Hauptangebot zugelassen. Eine Aufteilung in Lose erfolgt nicht.

Mit dem Angebot vorzulegen
Eigenerklärung zur Eignung (Formblatt 124) oder Nachweis der Präqualifikation
Nachweis der Fachkunde: Gütezeichen Kanalbau AK 2 oder gleichwertig
Urkalkulation im verschlossenen Umschlag auf Anforderung
Verzeichnis der Nachunternehmerleistungen (Formblatt 235)

Zuschlagskriterium ist der Preis (100 v. H.).

Sicherheiten: Vertragserfüllung 5 v. H. der Auftragssumme, Mängelansprüche 3 v. H. der Abrechnungssumme.

Auskünfte zum Verfahren erteilt die Zentrale Vergabestelle, Frau Meyer, vergabe@norderbek.test. Technische Auskünfte: Fachdienst Tiefbau, Herr Hartwig, Tel. +49 4122 5550 167. Fragen sind in Textform zu stellen; die Antworten gehen allen Bietern zu.

Anlagen: Leistungsverzeichnis (GAEB DA 83), Baubeschreibung, Lageplan 1:250, Längsschnitt, Schachtliste, Baugrundgutachten, Formblätter 124, 213, 221/222, 235."""

