Frage 2: Nach dem Längsschnitt mündet am Schacht M 212 der Kanal DN 300 aus dem Ulmenweg ein. Ein Schachtunterteil DN 1000 lässt die drei Anschlüsse in dieser Lage nicht zu. Ist ein größerer Schacht vorgesehen?
