Baumaßnahme: Erneuerung des Mischwasserkanals im Birkenweg, 2. Bauabschnitt, zwischen Eschenallee (Schacht M 208) und Lindenstraße (Schacht M 216), einschließlich der Anschlussleitungen bis zur Grundstücksgrenze und der Wiederherstellung der Verkehrsflächen.
Vergabenummer: TBA-2026-114, Öffentliche Ausschreibung nach VOB/A.
Angebotsfrist: {+14}, 10:00 Uhr
Bieterfragen bis: {+7}
Bindefrist: {+60}
Ausführungsbeginn: {+95}
Fertigstellung: {+250}
Vertragsgrundlagen sind die VOB/B und VOB/C in der bei Angebotsabgabe gültigen Fassung, die ZTV E-StB, die ZTV A-StB, die ZTV Asphalt-StB sowie DIN EN 1610 und das Arbeitsblatt DWA-A 139.
Der Birkenweg ist eine Anliegerstraße mit beidseitiger Wohnbebauung. Die Bauausführung erfolgt abschnittsweise unter Vollsperrung in Abschnitten von höchstens 60 m Länge. Die Zufahrt für Rettungsdienst und Müllabfuhr ist jederzeit, die Zufahrt der Anlieger zu den Grundstücken außerhalb der Arbeitszeit zu gewährleisten.
Der vorhandene Mischwasserkanal bleibt bis zur Umbindung der Anschlussleitungen in Betrieb. Die Vorflut ist während der gesamten Bauzeit aufrechtzuerhalten.
Baugrund: Unter der Fahrbahnbefestigung stehen nach dem Baugrundgutachten vom {-120} Auffüllungen bis 1,20 m, darunter Geschiebelehm und Geschiebemergel an, örtlich mit Sandlinsen. Schichtenwasser wurde zwischen 1,80 m und 2,60 m unter Gelände angetroffen. Das Gutachten liegt den Vergabeunterlagen bei.
Aushubboden: Der beim Aushub anfallende Boden bleibt Eigentum des Auftraggebers. Wiedereinbaufähiger Boden ist auf dem Zwischenlager des städtischen Bauhofs, Am Klärwerk 4 (Entfernung ca. 3,5 km), abzuladen. Die Entsorgung nicht verwertbarer Böden wird nach Deklaration gesondert nach Zuordnungsklassen vergütet.
Vorhandene Leitungen: Im Baufeld liegen Gas-, Wasser-, Strom- und Telekommunikationsleitungen. Der AN hat vor Baubeginn die Leitungsauskünfte der Versorgungsträger einzuholen.
Arbeitszeit: werktags 7:00 bis 18:00 Uhr. Nacht- und Wochenendarbeit nur mit Zustimmung des AG.
Vertragsstrafe: 0,1 v. H. der Auftragssumme je Werktag der Überschreitung des Fertigstellungstermins, höchstens 5 v. H.
Sicherheiten: Vertragserfüllungsbürgschaft 5 v. H., Mängelansprüchebürgschaft 3 v. H. der Abrechnungssumme. Verjährungsfrist für Mängelansprüche 5 Jahre.
Abrechnung nach Aufmaß. Stundenlohnarbeiten nur auf schriftliche Anordnung der Bauüberwachung."""
