reply_to = "anfrage"
body = """Guten Tag Herr Doe,

noch zwei Punkte zu meiner Anfrage von neulich, die unser Lagerleiter mir mitgegeben hat:

1. Die Halle bleibt die ganze Zeit in Betrieb. Wir haben dort täglich 30 bis 40 Lkw, die Tore 1 bis 6 müssen also immer erreichbar sein. Der Bereich direkt vor den Toren (etwa 12 m tief über die ganze Hallenlänge) kann deshalb nur am Wochenende gemacht werden, also Samstag ab 6 Uhr bis Sonntagabend. Montag früh um 5 Uhr kommt der erste Lkw, bis dahin muss die Fläche wieder befahrbar sein. Im LV steht das meines Wissens noch anders, bitte berücksichtigen Sie es trotzdem im Preis.

2. Der Mieter in Halle 4 möchte außerdem wissen, wie lange das Ganze ungefähr dauert. Wenn Sie dazu im Angebot etwas schreiben könnten, wäre das hilfreich.

Wäre es Ihnen recht, wenn wir uns die Fläche gemeinsam ansehen? Ich würde den {+3} um 10:00 Uhr vorschlagen, Treffpunkt am Pförtner, Containerstraße 9. Die anderen Firmen kommen an anderen Tagen. Passt Ihnen das? Sonst nennen Sie mir gern einen anderen Termin in der Woche."""
