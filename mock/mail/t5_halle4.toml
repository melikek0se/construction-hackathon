body = """Guten Tag Herr Doe,

Ihre Firma wurde uns von einem Nachbarbetrieb hier im Hafen empfohlen, deshalb schreibe ich Sie direkt an.

Wir bräuchten ein Angebot für die Erneuerung unseres Hofs vor Halle 4. Der Asphalt ist dort ziemlich am Ende, bei Regen steht das Wasser vor den Toren und die alten Rinnen sind zum Teil gebrochen. Die Fläche ist ungefähr 2.400 m² groß. Der Hof soll komplett neu entwässert und dann gepflastert werden, dazu kommt ein Ölabscheider, den verlangt wohl die Behörde.

Damit die Angebote vergleichbar sind, hat uns ein Ingenieur ein Leistungsverzeichnis vorbereitet, das hänge ich als PDF an. Ich bin selbst keine Bauingenieurin, bei fachlichen Fragen zum LV müsste ich also erst bei ihm nachfragen. Pläne gibt es bisher nur einen Lageplan, den kann ich Ihnen gern nachreichen.

Wir fragen insgesamt drei Firmen an. Schön wäre, wenn wir Ihr Angebot bis zum {+10} hätten, dann können wir das noch vor der Gesellschafterrunde besprechen. Die Arbeiten sollten möglichst im ersten Quartal laufen.

Falls Sie nicht anbieten möchten, geben Sie mir bitte kurz Bescheid."""
attach = ["lv:hof"]

