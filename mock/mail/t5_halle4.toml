Bauvorhaben: Erneuerung der Hofentwässerung und der Hofbefestigung vor Halle 4, Containerstraße 9, 21129 Hamburg.
Aufgestellt im Auftrag der Hansa Logistikpark Verwaltungs GmbH durch ein beauftragtes Ingenieurbüro.
Angebotsfrist: {+10}, 16:00 Uhr
Bindefrist: {+45}
Ausführungsbeginn: {+60}
Fertigstellung: {+130}
Die Hoffläche von ca. 2.400 m2 wird von Sattelzügen und Containerstaplern befahren, Belastungsklasse Bk3,2 nach RStO 12.
Geplanter Aufbau: Betonsteinpflaster 10 cm auf 4 cm Bettung, Schottertragschicht 30 cm, Frostschutzschicht 31 cm, Gesamtdicke 75 cm.
Entwässerungsrinnen und Abdeckungen im gesamten Hof in Klasse E 600 nach DIN EN 1433 bzw. DIN EN 124.
Die Arbeiten sind werktags von Montag bis Freitag zwischen 7:00 und 17:00 Uhr auszuführen. Der Hallenbetrieb läuft während der Bauzeit weiter, die Tore 1 bis 6 müssen jederzeit anfahrbar sein.
Die Ausführung erfolgt in mindestens drei Bauabschnitten nach Wahl des AG. Mehrkosten aus der abschnittsweisen Ausführung sind in die Einheitspreise einzurechnen.
Ein Baugrundgutachten liegt nicht vor. Nach Angabe des Betreibers steht unter der Asphaltbefestigung aufgefüllter Boden an.
Das Niederschlagswasser der Hoffläche wird über einen Leichtflüssigkeitsabscheider in den vorhandenen Regenwasserkanal DN 400 in der Containerstraße eingeleitet.
Vertragsgrundlage ist die VOB/B in der bei Vertragsschluss gültigen Fassung. Gewährleistung 5 Jahre.
Abrechnung nach Aufmaß. Stundenlohnarbeiten nur nach vorheriger schriftlicher Freigabe."""
