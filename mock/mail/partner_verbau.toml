[[doc]]
key = "p1_vorschlag"
file = "Verbauvorschlag_V-2291_Muehlenstrasse.pdf"
title = "Verbauvorschlag und Mietangebot V-2291"
text = """Bauvorhaben: Erneuerung Schmutzwasserkanal Mühlenstraße, Norderbek
Mieter: Acme Tiefbau GmbH, Hamburg
Grundlage: Ihre Angaben vom {-514}: Grabentiefe 2,60 bis 3,50 m auf rund 720 m, 3,50 bis 4,50 m auf rund 140 m (Station 0+620 bis 0+760), lichte Grabenbreite 1,40 m, PP-Rohre DN 300 und DN 400 in 6-m-Längen, Auffüllung über Geschiebelehm und Sand, Grundwasser bei 3,80 m, Tagesleistung 12 bis 15 m, Bagger 22 t.

Vorschlag:
Abschnitte bis 3,50 m Tiefe: randgestützte Verbauboxen 3,50 x 2,40 m mit Aufsatzbox 3,50 x 1,30 m, Rohrdurchlasshöhe 1,25 m. Sechs Einheiten ergeben 21 m verbauten Graben, das reicht für Aushub, Verlegen und Verfüllen im Umsetzverfahren. Die 6-m-Rohre werden schräg durch zwei Boxenfelder eingefädelt.
Abschnitt 3 (über 3,50 m bis 4,50 m, Bebauung dicht am Graben, Grundwasser): Gleitschienenverbau, einfache Schiene, Feldlänge 3,50 m, vier Felder. Der Verbau wird im Absenkverfahren eingebracht und setzungsarm gezogen.

Pos. | Bezeichnung | Menge | Einheit | EP | GP
1 | Verbaubox 3,50 x 2,40 m, je Element und Woche | 6 | El. | 89,00 | 534,00
2 | Aufsatzbox 3,50 x 1,30 m, je Element und Woche | 6 | El. | 42,00 | 252,00
3 | Gleitschiene bis 4,50 m, Feld 3,50 m, je Woche | 4 | Feld | 265,00 | 1.060,00
4 | An- und Abtransport mit Sattelzug, je Fuhre | 4 | Fuhre | 480,00 | 1.920,00
5 | Standsicherheitsnachweis Gleitschiene, geprüft | 1 | psch | 350,00 | 350,00

Die Beträge der Positionen 1 bis 3 gelten je Woche für die genannte Stückzahl.
Mindestmietzeit 4 Wochen je Position. Die Miete läuft vom Tag der Auslieferung bis zum Tag der Rückgabe in unserem Lager Neumünster, abgerechnet wird wochenweise, angefangene Wochen tageweise mit einem Fünftel.
Spindeln, Zuggeschirr und Verbindungsbolzen sind in der Miete enthalten. Reinigung bei Rückgabe in verschmutztem Zustand 35,00 EUR je Element. Schäden und fehlende Teile nach Aufwand.
Einweisung der Kolonne am ersten Tag durch unseren Anwendungstechniker kostenfrei.
Alle Preise netto. Zahlung 14 Tage netto. Angebot gültig bis {-470}."""

[[doc]]
key = "p1_statik"
file = "Standsicherheitsnachweis_Gleitschiene_Muehlenstrasse_Abschnitt_3.pdf"
title = "Standsicherheitsnachweis Gleitschienenverbau, Abschnitt 3"
text = """Bauvorhaben: Erneuerung Schmutzwasserkanal Mühlenstraße, Norderbek, Station 0+620 bis 0+760
Mieter: Acme Tiefbau GmbH, Hamburg. Mietvertrag V-2291.

Nachgewiesen wird der Gleitschienenverbau, einfache Schiene, Feldlänge 3,50 m, Plattenhöhe 2,40 m plus 1,30 m plus 1,30 m, für eine Grabentiefe bis 4,50 m und eine lichte Grabenbreite von 1,40 m.

Lastannahmen: Erddruck nach DIN 4085 für Auffüllung (bis 1,20 m), Geschiebelehm und Sand nach Baugrundgutachten; Wasserdruck ab 3,80 m unter Gelände; Verkehrslast 10 kN/m² im Abstand von 0,60 m zur Grabenkante (halbseitige Sperrung, Lkw-Verkehr); Gebäudelast Häuser Nr. 14 bis 22 mit 30 kN/m² im Abstand von 2,10 m.

Ergebnis: Die zulässige Plattenbelastung von 44 kN/m² wird mit 37 kN/m² eingehalten. Die Laufwagen sind in zwei Lagen anzuordnen, der untere 1,10 m über Grabensohle. Rohrdurchlasshöhe 1,10 m.

Auflagen: Kein Aushub mehr als 0,50 m unter Plattenunterkante vorauseilend. Bei Wasserzutritt in der Sohle ist die offene Wasserhaltung vor dem weiteren Absenken in Betrieb zu nehmen. Ziehen des Verbaus lagenweise mit dem Verfüllen.

Der Nachweis ist von einem Prüfingenieur für Standsicherheit geprüft; der Prüfbericht ist beigefügt."""

