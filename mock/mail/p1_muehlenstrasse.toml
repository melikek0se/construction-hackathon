Das Material ist im LV nicht enthalten. Position 2.2.50 gilt nach der Bieterinformation Nr. 1 nur bis Z 2. Wir separieren das Material und lagern es abgedeckt auf Folie am Festplatz. Geschätzte Menge: rund 230 m³ beziehungsweise 420 t.

Wir zeigen hiermit Mehrkosten nach § 2 Abs. 6 VOB/B sowie eine Behinderung nach § 6 Abs. 1 VOB/B an (Stillstand der Kolonne am {-406} und {-405} bis zur Klärung des Entsorgungswegs). Ein Nachtragsangebot folgt kurzfristig. Bitte teilen Sie mit, ob so verfahren werden soll.

Mit freundlichen Grüßen"""

