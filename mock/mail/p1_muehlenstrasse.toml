body = """Sehr geehrte Frau Meyer,

bei der Durchsicht des Leistungsverzeichnisses haben sich vier Fragen ergeben, um deren Beantwortung wir bitten:

1. Position 4.1.40 „Asphaltdeckschicht AC 11 D S, 4 cm“, 2600 m
Der Langtext nennt „Abrechnung nach eingebauter Fläche“, die Mengeneinheit ist jedoch m. Die übrigen Schichten (4.1.10 bis 4.1.30) sind mit 2150 m² ausgeschrieben. Wir gehen davon aus, dass m² gemeint ist und die Deckschicht über die volle Fahrbahnbreite größer ist als die Grabenwiederherstellung. Bitte bestätigen Sie Einheit und Menge.

2. Position 2.2.50 „Boden entsorgen, Zuordnung Z 2“, 800 t
Im Langtext heißt es „Boden der Zuordnungsklasse Z 2 nach LAGA M 20 und höher belasteten Boden abfahren und ordnungsgemäß entsorgen“. Eine Entsorgung oberhalb Z 2 ist ohne Kenntnis von Art und Menge der Belastung nicht kalkulierbar; die Vorbemerkungen sagen zudem, dass solche Belastungen nicht zu erwarten sind. Wir gehen davon aus, dass die Position nur Material bis Z 2 umfasst und höher belastetes Material gesondert vergütet wird.

3. Position 1.2.10 „Verkehrssicherung einrichten, vorhalten, räumen“, 1 psch
Laut Langtext werden „Änderungen der Verkehrsführung, auch Vollsperrungen mit Umleitungsbeschilderung, ohne gesonderte Vergütung ausgeführt“. Liegt bereits ein abgestimmter Verkehrszeichenplan vor? Mit wie vielen Bauabschnitten und Umsetzungen ist zu rechnen? Wir kalkulieren derzeit mit halbseitiger Sperrung in vier Abschnitten ohne Vollsperrung.

4. Position 3.1.60 „Hausanschluss umbinden“
Die Menge fehlt. Aus den Abzweigen (3.1.40 und 3.1.50) ergeben sich 56 Stück. Bitte teilen Sie die Menge mit.

Vielen Dank im Voraus.

Mit freundlichen Grüßen"""

