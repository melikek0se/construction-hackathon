2. Position 2.1.30 „Grabenverbau“, 3300 m²
Im Langtext heißt es „Art des Verbaus nach Wahl des AG“. Zwischen einem Gleitschienenverbau und einem Spundwandverbau liegt bei 3,80 m Tiefe und Grundwasserabsenkung ein Vielfaches im Preis. Die Baubeschreibung nennt keinen Verbau. Wir gehen davon aus, dass ein Linearverbau (Gleitschienen, Doppelgleitschiene ab 3,00 m) zugrunde zu legen ist und ein vom AG verlangter anderer Verbau gesondert vergütet wird. Bitte bestätigen Sie das oder legen Sie die Verbauart fest.

3. Position 1.1.20 „Verkehrssicherung und Schulwegsicherung“, 1 psch
Die Pauschale enthält „Sicherungsposten zu den Schulzeiten“ nach Vorgabe der Schulleitung. Zu welchen Uhrzeiten, an wie vielen Stellen und über wie viele Schultage sind Posten zu stellen? Wir nehmen an: zwei Posten, an Schultagen 7:15 bis 8:15 Uhr und 12:30 bis 13:45 Uhr, über die gesamte Bauzeit außerhalb der Ferien.

4. Position 2.1.70 „Rohrgraben verfüllen“, 1700 m²
Der Text sagt „Abrechnung nach Raummaß im eingebauten Zustand“, die Einheit ist m². Wir gehen von 1700 m³ aus.

Mit freundlichen Grüßen"""

