An- und Abfahrten sowie das Einrichten der Einzelbaustellen werden nicht gesondert vergütet.
Verkehrsrechtliche Anordnungen beantragt der AN. Oberflächen werden nach den Vorgaben des jeweiligen Straßenbaulastträgers wiederhergestellt.
Abrechnung je Einzelmaßnahme nach Aufmaßblatt des AG, Rechnungsstellung monatlich gesammelt."""
