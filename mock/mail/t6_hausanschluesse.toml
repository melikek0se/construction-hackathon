[[doc]]
key = "anschreiben"
file = "SWN-RV-2027-02_Aufforderung_Angebotsabgabe.pdf"
title = "Aufforderung zur Angebotsabgabe – Rahmenvertrag Hausanschlüsse Gas/Wasser 2027"
text = """Vergabe-Nr.: SWN-RV-2027-02
Verfahren: Beschränkte Ausschreibung im Sektorenbereich, Vertragsgrundlage VOB/B

Sehr geehrte Damen und Herren,

die Stadtwerke Norderbek GmbH beabsichtigt, die Tiefbau- und Rohrverlegearbeiten für Gas- und Trinkwasser-Hausanschlüsse im Jahr 2027 erneut im Rahmenvertrag zu vergeben. Wir fordern Sie auf, auf der Grundlage des beigefügten Preisblatts ein Angebot abzugeben.

Termine
Angebotsfrist: {+2}, 10:00 Uhr
Bindefrist: {+40}
Vergabeentscheidung: voraussichtlich KW {kw+12}
Vertragsbeginn: 01.01.2027
Vertragsende: 31.12.2027

Preise
Die Einheitspreise gelten für 12 Monate ab Vertragsbeginn als Festpreise. Eine Preisgleitung (Lohn-, Stoff- oder Kraftstoffgleitklausel) ist nicht vereinbart und wird auch nicht nachträglich zugestanden.
Der AG kann den Vertrag einmalig um 12 Monate zu unveränderten Preisen verlängern; die Erklärung erfolgt bis zum 30.09.2027.

Umfang
Im Mittel der letzten drei Jahre wurden abgerufen:
Jahr | Art | Anzahl
2024 | Hausanschlüsse Wasser | 98
2024 | Hausanschlüsse Gas | 71
2025 | Hausanschlüsse Wasser | 104
2025 | Hausanschlüsse Gas | 55
2026 | Hausanschlüsse Wasser (bis Oktober) | 91
2026 | Hausanschlüsse Gas (bis Oktober) | 37
Die Mengen des Preisblatts sind Schätzmengen. Ein Mindestabruf wird nicht zugesichert.

Mit dem Angebot einzureichen
- ausgefülltes Preisblatt (Excel und unterschriebener Ausdruck)
- Zertifikat nach DVGW GW 301, Gruppen G3 ge und W3 ge
- Nachweis von mindestens zwei Kolonnen mit geprüften PE-Schweißern nach DVGW GW 330
- Unbedenklichkeitsbescheinigungen von Finanzamt, Krankenkasse und Berufsgenossenschaft
- Nachweis der Betriebshaftpflichtversicherung, Deckung mindestens 5 Mio. EUR

Wertung
Gewertet wird die Summe aus Einheitspreisen und Schätzmengen des Preisblatts. Bedarfs- und Wahlpositionen werden mit gewertet.

Rückfragen richten Sie bitte bis zwei Werktage vor Ablauf der Angebotsfrist an netzbau@stadtwerke-norderbek.test."""

