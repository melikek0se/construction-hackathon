3.40 | - m | Mehrlänge Kombianschluss | Mehrlänge über 10 m zu Position 3.30, je Meter gemeinsamer Graben mit beiden Leitungen.
3.50 | 48 St | Mauerdurchführung Gas, Kernbohrung | Kernbohrung bis 150 mm Durchmesser durch Kellerwand aus Mauerwerk oder Beton bis 40 cm Dicke herstellen, beigestellte Gas-Hauseinführung mit Ausziehsicherung einsetzen und abdichten.
