5.60 | 25 St | Handschachtung im Bereich von Fremdleitungen | Zulage für Handschachtung bei Kreuzung oder Parallelführung von Kabeln und Leitungen Dritter, je Kreuzungsstelle, ohne gesonderte Vergütung von Sicherungsmaßnahmen.
5.70 | 150 h | Stundenlohn Kolonne Tiefbau, Facharbeiter | Stundenlohnarbeiten Facharbeiter einschließlich Kolonnenfahrzeug und Kleingerät, nur nach Anordnung des Netzmeisters.
5.80 | 60 h | Rufbereitschaft, Einsatzstunde außerhalb der Arbeitszeit | Einsatzstunde einer Kolonne aus zwei Mann mit Minibagger bei Störungen außerhalb der Regelarbeitszeit, Eintreffen an der Einsatzstelle innerhalb von 90 Minuten. Das Vorhalten der Rufbereitschaft an 365 Tagen ist mit dem Stundensatz abgegolten. | A
