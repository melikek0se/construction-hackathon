Anbei erhalten Sie
- das Anschreiben mit Terminen und Bedingungen (PDF),
- das Preisblatt mit den Schätzmengen für 2027 (Excel).

Bitte beachten Sie:
Die Angebotsfrist endet am {+2} um 10:00 Uhr. Das Preisblatt ist vollständig auszufüllen, auch die Bedarfs- und Wahlpositionen. Die Einheitspreise sind für 12 Monate fest, eine Preisgleitung ist nicht vorgesehen.

Gegenüber dem Vorjahr neu sind die Positionen für den Kombianschluss im gemeinsamen Graben (3.30, 3.40) und die Rufbereitschaft (5.80). Die Gasmengen haben wir wegen der rückläufigen Anfragen niedriger angesetzt.

Das Angebot senden Sie bitte per E-Mail an diese Adresse und den unterschriebenen Ausdruck per Post nach."""
