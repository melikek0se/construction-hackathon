body = """Sehr geehrte Frau Lührs,

vielen Dank für die Unterlagen. Wir waren am {-406} vor Ort und haben zum Leistungsverzeichnis vier Fragen:

1. Position 3.4.40 „Provisorische Wasserversorgung“, 1 psch
Der Langtext lässt offen: „Anzahl der zu versorgenden Anschlüsse und Dauer nach Bauablauf“. Für eine Pauschale brauchen wir einen Rahmen. Wir nehmen an, dass je Bauabschnitt (bis 150 m) die dort liegenden Anschlüsse für längstens zwei Wochen über eine Notleitung da 63 versorgt werden, insgesamt 46 Anschlüsse. Ist das so richtig, und ist die Notleitung zu desinfizieren und zu beproben?

2. Position 3.3.40 „Hausanschlussleitung PE da 63“
Die Position hat keine Menge. Wie viele Meter sind für die Gewerbeanschlüsse vorgesehen?

3. Position 3.4.20 „Spülen, Desinfektion, Probenahme“, 1 psch
„Wiederholungen bis zur Freigabe ohne gesonderte Vergütung“: Ein schlechter Befund kann auch aus dem Bestandsnetz oder aus der Probenahme stammen. Wir gehen davon aus, dass eine Wiederholung je Abschnitt im Preis liegt und weitere Wiederholungen nur dann zu unseren Lasten gehen, wenn die Ursache bei uns liegt.

4. Position 2.2.30 „Asphaltdeckschicht AC 8 D N, 3 cm“, 1480 t
Der Langtext sagt „Abrechnung nach Fläche“, die Einheit ist t. Bei 1.480 m² und 3 cm wären es rund 110 t. Wir gehen von 1.480 m² aus.

Mit freundlichen Grüßen"""

