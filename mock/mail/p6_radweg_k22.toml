body = """Sehr geehrte Damen und Herren,

zur Vergabe LBSW-W-33-0719 stellen wir die folgenden Bieterfragen; gleichlautend haben wir sie auf der Vergabeplattform eingestellt:

1. Position 2.1.60 „Überschussboden verwerten“
Die Position enthält keine Menge (Einheit t). Aus den Positionen 2.1.10, 2.1.20 und 2.1.50 errechnen wir rund 2.900 m³ Überschuss, das entspricht etwa 5.200 t. Bitte nennen Sie die Menge.

2. Position 3.2.20 „Asphaltdeckschicht AC 8 D N, 3 cm“, 4100 t
Laut Langtext erfolgt die „Abrechnung nach eingebauter Fläche“, die Einheit ist jedoch t. Die Tragschicht (3.2.10) ist mit 4100 m² ausgeschrieben; 4100 m² Deckschicht von 3 cm entsprechen rund 300 t. Wir gehen davon aus, dass 4100 m² gemeint sind.

3. Position 4.1.40 „Grabenverrohrungen und Zufahrten anpassen“, 1 psch
„Anzahl und Umfang nach örtlicher Feststellung“ lässt eine Pauschale nicht zu. In den Lageplänen zählen wir sieben Feldzufahrten; ob deren Verrohrungen zu verlängern oder zu erneuern sind, ist nicht erkennbar. Wir bitten um Angabe von Anzahl, Nennweite und Länge oder um Umwandlung in Einheitspreispositionen. Vorläufig nehmen wir sieben Zufahrten mit je 3 m Verlängerung DN 300 an.

4. Position 1.1.50 „Verkehrssicherung vorhalten, Vollsperrung“, 30 d, Bedarfsposition
Nach den Vorbemerkungen ist eine Vollsperrung nur für den Asphalteinbau an den Einmündungen zulässig. Dafür genügen nach unserer Einschätzung drei bis fünf Tage. Wird die Position mit 30 Tagen gewertet?

Mit freundlichen Grüßen"""

