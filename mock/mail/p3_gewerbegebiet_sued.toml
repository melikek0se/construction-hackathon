cc = ["arch.kroeger"]
subject = "Bieterfragen zu OP-ITZ-417 – Erschließung Gewerbegebiet Süd, 1. BA"
body = """Sehr geehrte Frau Ohlsen, sehr geehrter Herr Kröger,

zum Leistungsverzeichnis bitten wir um Klärung der folgenden vier Punkte:

1. Position 4.2.30 „Asphaltdeckschicht AC 11 D S, 4 cm“
Die Position enthält keine Menge. Tragschicht und Binder (4.2.10, 4.2.20) sind mit je 8.600 m² ausgeschrieben. Wir gehen von ebenfalls 8.600 m² aus. Zudem: Der Einbau soll „nach Abschluss der Hochbauarbeiten auf gesonderten Abruf des AG“ erfolgen. Liegt der Abruf innerhalb der Ausführungsfrist bis {-60}? Andernfalls bitten wir um eine Preisgleitung oder einen spätesten Abruftermin.

2. Position 3.2.10 „Rohrgraben Schmutzwasserkanal“, 2700 m³
Der Text lautet „Wie Position 3.1.10, jedoch für den Schmutzwasserkanal, Grabentiefe bis 3,50 m“. Position 3.1.10 schließt den Verbau „nach Wahl des AN“ und die Leitungszone ein. Gilt das auch für 3.2.10, obwohl ab 3,00 m Tiefe und im Schichtenwasser ein anderer Verbau nötig wird? Wir nehmen an: ja, Verbau und Leitungszone sind auch hier im Kubikmeterpreis enthalten.

3. Position 3.1.80 „Anschluss an Regenrückhaltebecken“, 1 psch
Das Auslaufbauwerk ist „nach Angabe der Bauüberwachung“ auszuführen; einen Plan haben wir in den Unterlagen nicht gefunden. Für eine Pauschale benötigen wir Abmessungen, Betonmenge und die Fläche der Sohlsicherung. Wir kalkulieren vorläufig mit einem Stirnwandbauwerk von rund 6 m³ Beton C30/37 und 25 m² Wasserbausteinen.

4. Position 2.1.60 „Bodenverbesserung mit Bindemittel“, 3500 m³, Bedarfsposition
Die Menge entspricht rund 70 % der Planumsfläche bei 40 cm Tiefe. Bei dieser Größenordnung ist die Leistung nach dem Geotechnischen Bericht eher die Regel als ein Bedarf. Wird die Position gewertet? Wir regen an, sie als Grundposition mit realistischer Menge auszuschreiben.

Mit freundlichen Grüßen"""

