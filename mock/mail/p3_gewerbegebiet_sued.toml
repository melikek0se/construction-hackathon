Fragen zu den Vergabeunterlagen: ausschließlich in Textform bis {-293} an Ohlsen + Partner Ingenieure
Ausführungsfristen: Beginn {-235}, Gesamtfertigstellung {-60}. Einzelfrist: Kanalbau und Tragschichten Planstraße A bis {-130}.

Angebote sind elektronisch in Textform über den Vergabemarktplatz Nord einzureichen. Nebenangebote sind nicht zugelassen. Eine Aufteilung in Lose findet nicht statt.

Mit dem Angebot sind vorzulegen: Angebotsschreiben, Leistungsverzeichnis mit Preisen, Eigenerklärung zur Eignung oder Präqualifikationsnachweis, Formblatt 221 oder 222, Verzeichnis der Nachunternehmerleistungen.
Zuschlagskriterium: Preis 100 %.
Sicherheiten: Vertragserfüllung 5 %, Mängelansprüche 3 %. Vertragsstrafe nach den Besonderen Vertragsbedingungen, Nr. 2.

Die Anlagen (Baubeschreibung, Lagepläne, Höhenpläne, Regelquerschnitte, Geotechnischer Bericht) sind auf dem Vergabemarktplatz abrufbar. Das Leistungsverzeichnis liegt als GAEB-Datei DA 83 bei."""

