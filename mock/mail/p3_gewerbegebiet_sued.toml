Vergabeart: Öffentliche Ausschreibung nach VOB/A, Abschnitt 1

Sehr geehrte Damen und Herren,

im Namen und für Rechnung der Stadt Itzehoe fordern wir Sie zur Abgabe eines Angebots für die oben genannte Bauleistung auf.

Ablauf der Angebotsfrist, zugleich Eröffnungstermin: {-286|long}, 11:00 Uhr
