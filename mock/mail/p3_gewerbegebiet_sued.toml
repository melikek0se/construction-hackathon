reply_to = "fragen"
body = """Hallo Herr Doe,

danke für die Fragen, hier die Antworten. Geht als Bieterinfo 1 heute Abend auch auf den Marktplatz.

zu 1) Pos. 4.2.30: Stimmt, die Menge ist uns durchgerutscht. 8.600 m². Der Abruf der Deckschicht liegt innerhalb der Ausführungsfrist, spätestens acht Wochen vor Fertigstellung. Preisgleitung gibt es nicht.

zu 2) Pos. 3.2.10: Ja, gilt genauso. Verbau und Leitungszone sind im m³-Preis drin, auch bei 3,50 m. Welchen Verbau Sie nehmen, ist Ihre Sache.

zu 3) Pos. 3.1.80: Der Detailplan für das Auslaufbauwerk ist noch in der Abstimmung mit der Wasserbehörde, den kann ich im Moment nicht rausgeben. Orientieren Sie sich am Lageplan Blatt 4 und am Regelwerk. Das Bauwerk ist mit der Pauschale einzukalkulieren, eine Aufteilung in Einzelpositionen ist nicht vorgesehen.

zu 4) Pos. 2.1.60: Bleibt Bedarfsposition, wird aber gewertet. Wir haben mit dem Bodengutachter noch mal gesprochen und setzen die Menge auf 1.200 m³ herab. Bitte mit dieser Menge anbieten, die berichtigte GAEB-Datei kommt mit der Bieterinfo.

Bei weiteren Fragen gern noch mal melden, Frist dafür ist der {-293}."""

