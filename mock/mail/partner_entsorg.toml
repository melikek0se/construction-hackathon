subject = "AW: Angebotsanfrage Nachunternehmerleistung – Bodenentsorgung Klei und Torf – Abwasserpumpwerk Deichstraße mit Druckleitung"
reply_to = "p4_anfrage"
body = """Guten Tag Herr Doe,

Klei und Torf sind ein eigenes Thema, deshalb etwas ausführlicher.

Das Material ist in der Regel nicht schadstoffbelastet, aber organisch. Maßgeblich ist der Gehalt an organischem Kohlenstoff (TOC). Mit den Zuordnungsklassen Z 0 bis Z 2 kommt man hier nicht weiter: Eine Verfüllung nimmt Boden mit mehr als 1 % TOC nicht an, die Deponie der Klasse I ohne Ausnahme nur bis 1 %, mit Zustimmung der Behörde bis 6 %. Darüber bleibt die Deponieklasse II oder eine Rekultivierungsmaßnahme, wenn gerade eine annimmt.

Unser Preis, Liste liegt ausgefüllt bei:
- 41,50 €/t, wenn die Deklarationsanalytik einen TOC bis 6 % ergibt
- 58,00 €/t bei TOC über 6 %

Ohne Analyse kann ich Ihnen nicht sagen, welcher Preis gilt. Reiner Klei liegt meist bei 3 bis 5 %, mit Torflagen schnell bei 10 % und mehr. Bei 4,50 m Klei und Torf im Wechsel rechne ich eher mit dem höheren Wert.

