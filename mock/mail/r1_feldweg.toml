[[mail]]
id = "anfrage"
day = -13
time = "08:12"
from = "wvg.luehrs"
to = "us"
subject = "Angebotsanfrage WVG-N-2644: Hausanschlüsse und Schieberkreuz Feldweg, Brande"
body = """Hallo Herr Doe,

wir müssen im Feldweg in Brande noch vor dem Winter die Hausanschlüsse erneuern, nach dem dritten Rohrbruch in diesem Jahr will der Vorstand nicht länger warten. Bei der Gelegenheit kommt das Schieberkreuz an der Dorfstraße mit raus, zwei der vier Schieber lassen sich nicht mehr schließen.

Wegen der Eile vergeben wir freihändig und fragen drei Firmen an. Das LV bekommen Sie als D83 im Anhang, 14 Anschlüsse, ein Schieberkreuz, ein Hydrant.

Angebotsfrist: {-8}, 12:00 Uhr, per Mail an mich, gern als D84
Baubeginn: {+12}
Fertig bis: {+47}

Die Vergabe geht schnell, ich will in der Woche nach der Abgabe beauftragen. Rückfragen bitte kurz per Mail, ich bin viel im Netz unterwegs."""
attach = ["lv:lv"]

