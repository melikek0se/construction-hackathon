body = """Hallo Herr Doe,

zum Baubeginn im Feldweg, Herr Albers ist in Kopie:

Es bleibt beim {+12}. Die Bauanlaufbesprechung möchte ich am {+7} um 8:00 Uhr vor Ort machen, Treffpunkt an der Einmündung Dorfstraße. Unser Netzmeister ist dabei und zeigt, welche Schieber er für die Absperrung des Kreuzes zieht.

Zwei Bitten vorab:
- Die Anliegerschreiben für die ersten vier Anschlüsse (Feldweg 2 bis 8) bitte bis zur Besprechung im Entwurf mitbringen, wir setzen unser Logo dazu.
- Das Schieberkreuz bitte nicht an einem Freitag: wenn beim Einbinden etwas schiefgeht, will ich nicht übers Wochenende das halbe Dorf ohne Wasser haben.

Die verkehrsrechtliche Anordnung beantragen Sie; das Amt braucht dafür erfahrungsgemäß zwei Wochen, das wird also knapp."""
