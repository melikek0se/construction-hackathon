[[lv]]
key = "lv"
file = "LV_Feldweg_Hausanschluesse_Schieberkreuz"
format = "d83"
client = "wvg"
name = "Hausanschlüsse und Schieberkreuz Feldweg"
project = "Erneuerung Trinkwasser-Hausanschlüsse und Schieberkreuz Feldweg, Brande"
number = "WVG-N-2644"
remarks = """Vorbemerkungen zur Angebotsanfrage WVG-N-2644
Maßnahme: Erneuerung von 14 Trinkwasser-Hausanschlüssen und des Schieberkreuzes an der Einmündung Feldweg / Dorfstraße in Brande-Hörnerkirchen.
Vergabeart: Freihändige Vergabe nach VOB/A, Angebotsanfrage an drei Firmen.
Angebotsfrist: {-8}, 12:00 Uhr
Bindefrist: {+20}
Ausführungsbeginn: {+12}
Fertigstellung: {+47}
Die Versorgungsleitung im Feldweg (PVC DN 150, Baujahr 1974) bleibt in Betrieb. Die Hausanschlüsse aus Stahl und PE-weich werden durch PE 100 RC da 40 ersetzt, Überdeckung 1,30 m.
Das Schieberkreuz wird mit drei Schiebern DN 150 und einem Schieber DN 100 erneuert, dazu ein Unterflurhydrant DN 80.
Versorgungsunterbrechungen sind je Anschluss auf höchstens 4 Stunden zu begrenzen und den Anliegern 3 Werktage vorher schriftlich anzukündigen. Absperrungen im Netz nimmt nur der Netzmeister des AG vor.
Der Feldweg ist eine Anliegerstraße mit Asphaltfahrbahn 4,50 m und einseitigem Gehweg aus Betonpflaster. Die Zufahrt für Anlieger, Müllabfuhr und Rettungsdienst ist zu gewährleisten.
Ausführung nach DVGW W 400-2 und DIN EN 805. Der AN muss nach DVGW GW 301 mindestens in der Gruppe W3 zertifiziert sein.
Ein Baugrundgutachten liegt nicht vor. Nach den Erfahrungen des AG stehen Sande und Geschiebelehm an, Grundwasser tiefer als 2,00 m.
Abrechnung nach Aufmaß, Vertragsgrundlage VOB/B."""
items = """
# 1 | Baustelleneinrichtung
# 1.1 | Baustelleneinrichtung und Verkehrssicherung
1.1.10 | 1 psch | Baustelle einrichten und räumen | Baustelle für sämtliche Leistungen einrichten, vorhalten und räumen, einschließlich Lagerfläche, Bauwagen und sanitären Einrichtungen.
1.1.20 | 1 psch | Verkehrssicherung Anliegerstraße | Verkehrssicherung nach RSA 21 für Arbeiten in der Anliegerstraße mit abschnittsweiser halbseitiger Sperrung und Sicherung des Gehwegs aufbauen, für die Bauzeit vorhalten, umsetzen und abbauen, einschließlich verkehrsrechtlicher Anordnung.
1.1.30 | 6 St | Suchschachtung | Suchschachtung in Handarbeit zum Feststellen der Lage von Leitungen und Kabeln, bis 1,50 m Tiefe und 1,5 m3 je Stück, wieder verfüllen.
# 2 | Erdarbeiten
# 2.1 | Aufbruch und Rohrgraben
2.1.10 | 96 m2 | Asphaltbefestigung aufbrechen | Asphaltbefestigung der Fahrbahn bis 14 cm Dicke einschließlich Schneiden der Kanten aufbrechen, laden und verwerten.
2.1.20 | 142 m2 | Betonpflaster im Gehweg aufnehmen | Betonpflaster 8 cm im Gehweg aufnehmen, reinigen und für den Wiedereinbau seitlich lagern, Bettung entsorgen.
2.1.30 | 268 m3 | Boden für Rohrgräben und Baugruben ausheben | Boden für Rohrgräben der Hausanschlüsse und für die Baugrube des Schieberkreuzes profilgerecht ausheben, Tiefe bis 1,75 m, seitlich lagern oder laden. // Verbau nach DIN 4124 und Wasserhaltung sind ohne gesonderte Vergütung einzurechnen.
2.1.40 | 170 t | Überschüssigen Boden entsorgen | Überschüssigen und nicht wieder einbaufähigen Boden abfahren und verwerten, Zuordnung bis Z 1.2, einschließlich Deklaration. Abrechnung nach m3 Aushubprofil.
2.1.50 | 105 m3 | Füllsand für Leitungszone liefern und einbauen | Leitungszone mit Füllsand 0/2 herstellen und in Lagen verdichten, Material liefern.
2.1.60 | 163 m3 | Gräben mit Aushub verfüllen | Rohrgräben und Baugruben oberhalb der Leitungszone mit gelagertem Aushub lagenweise verfüllen und verdichten, Verdichtungsgrad DPr mindestens 97 Prozent.
2.1.70 | 40 m3 | Bodenaustausch | Nicht verdichtungsfähigen Aushub zusätzlich entsorgen und durch gelieferten Füllsand ersetzen, nur auf Anordnung des AG. | E
# 3 | Rohrleitungsbau
# 3.1 | Hausanschlüsse
3.1.10 | 14 St | Hausanschluss PE 100 RC da 40 bis 8 m | Trinkwasser-Hausanschluss aus PE 100 RC da 40, SDR 11, Länge bis 8 m, mit Anbohrarmatur mit Betriebsabsperrung auf PVC DN 150, Einbaugarnitur und Straßenkappe liefern und einbauen, Rohr auf Sandbettung verlegen, Trassenwarnband.
3.1.20 | 38 m | Mehrlänge Hausanschluss | Mehrlänge über 8 m zu Position 3.1.10, Rohr da 40 liefern und verlegen.
3.1.30 | 14 St | Hauseinführung und Umbinden im Gebäude | Hauseinführung durch die Kellerwand mit Kernbohrung und Ringraumdichtung herstellen, neue Leitung an die vorhandene Wasserzähleranlage anbinden, spülen und in Betrieb nehmen.
3.1.40 | 14 St | Alten Hausanschluss trennen | Alten Hausanschluss an der Versorgungsleitung abtrennen, Anbohrstelle mit Reparaturschelle verschließen.
# 3.2 | Schieberkreuz
3.2.10 | 3 St | Absperrschieber DN 150, PN 16 | Weichdichtender Absperrschieber DN 150 nach DIN EN 1074, PN 16, Fabrikat Hanse Armaturen Typ ES-W, mit Einbaugarnitur, Tragplatte und Straßenkappe liefern und einbauen.
3.2.20 | 1 St | Absperrschieber wie Position 3.2.10, jedoch DN 100 | Absperrschieber wie Position 3.2.10, jedoch DN 100.
3.2.30 | 1 St | Kreuzstück DN 150 mit Formstücken | Kreuzstück aus duktilem Guss DN 150/150 mit Reduzierung auf DN 100, Flanschverbindungen, Dichtungen und Schrauben A4 liefern und einbauen, einschließlich Widerlager aus Beton.
3.2.40 | 12 m | Einbindung PE 100 RC da 180 | Einbindung in die vorhandenen Leitungen mit PE 100 RC da 180, SDR 11, und zugfesten Übergangsstücken auf PVC DN 150 herstellen.
3.2.50 | 1 St | Unterflurhydrant DN 80 | Unterflurhydrant DN 80 nach DIN EN 14339, Rohrdeckung 1,25 m, mit Fußbogen, Straßenkappe und Hinweisschild liefern und einbauen.
3.2.60 | 1 psch | Druckprüfung, Desinfektion und Spülung | Druckprüfung nach DVGW W 400-2, Desinfektion und Spülung der neuen Leitungsteile, bakteriologische Probe durch ein zugelassenes Labor, Dokumentation.
# 4 | Oberflächen
# 4.1 | Wiederherstellung
4.1.10 | 96 m2 | Asphaltbefestigung wiederherstellen | Asphaltbefestigung der Fahrbahn wiederherstellen: Asphalttragschicht AC 22 T N 10 cm, Deckschicht AC 11 D N 4 cm, Rückschnitt 15 cm, Fugen mit Fugenband.
4.1.20 | 142 m2 | Betonpflaster wieder verlegen | Gelagertes Betonpflaster im Gehweg auf neuer Bettung 4 cm wieder verlegen, abrütteln und einsanden, Fehlmengen bis 5 Prozent liefern.
4.1.30 | 110 m2 | Schottertragschicht ergänzen | Schottertragschicht 0/45 unter Fahrbahn und Gehweg in einer Dicke von 20 cm ergänzen und verdichten.
# 5 | Stundenlohn
# 5.1 | Stundenlohnarbeiten
5.1.10 | 30 h | Facharbeiter | Stundenlohnarbeiten Facharbeiter nach Anordnung des AG.
"""

