id = "frage"
day = -11
time = "09:30"
from = "us.doe"
to = "wvg.luehrs"
subject = "AW: Angebotsanfrage WVG-N-2644: Hausanschlüsse und Schieberkreuz Feldweg, Brande"
reply_to = "anfrage"
body = """Hallo Frau Lührs,

danke für die Anfrage, wir bieten an. Eine Rückfrage zu Position 2.1.40 (Boden entsorgen):

Die Menge steht mit 170 t im LV, im Langtext heißt es aber "Abrechnung nach m3 Aushubprofil". Was gilt: Abrechnung nach Wiegescheinen in Tonnen oder nach Profil in Kubikmetern? Bei 170 Einheiten macht das im Preis fast den Faktor zwei aus.

Viele Grüße
John Doe"""

[[mail]]
id = "antwort"
day = -10
time = "10:15"
from = "wvg.luehrs"
to = "us"
subject = "AW: Angebotsanfrage WVG-N-2644: Hausanschlüsse und Schieberkreuz Feldweg, Brande"
reply_to = "frage"
body = """Hallo Herr Doe,

gut gesehen, der Satz im Langtext ist aus einem alten LV stehen geblieben. Es gilt die Einheit: Position 2.1.40 wird in Tonnen nach den Wiegescheinen der Annahmestelle abgerechnet. Die 170 t habe ich aus rund 105 m³ Verdrängung durch Sand und Leitungen gerechnet.

Die beiden anderen Firmen bekommen die Antwort auch. Ein neues LV verschicke ich deswegen nicht, die Frist bleibt beim {-8}."""

