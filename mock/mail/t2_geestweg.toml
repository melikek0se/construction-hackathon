body = """Moin Herr Doe,

wir erneuern im Frühjahr die alte AZ-Leitung im Geestweg, rund 640 m da 180 und ein Stück da 110 in die Dorfstraße, dazu 28 Hausanschlüsse umbinden. Nach der Hauptstraße in Brande würde ich mich freuen, wenn Sie wieder mit anbieten. Wir haben fünf Firmen angeschrieben.

Das LV hängt als GAEB-Datei an (D83, unser Programm kann leider nichts Neueres). Pläne und die Leitungsauskünfte schicke ich Ihnen gern als Download-Link, sagen Sie Bescheid.

