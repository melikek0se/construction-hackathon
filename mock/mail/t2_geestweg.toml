remarks = """Vorbemerkungen
Der Wasserverband Geestrand erneuert die Trinkwasserleitung DN 150 im Geestweg von der Einmündung Dorfstraße bis zum Ortsausgang Richtung Bokel sowie die Stichleitung DN 100 in der Dorfstraße. Die vorhandene Leitung aus Asbestzement DN 150 wird außer Betrieb genommen. 28 Hausanschlüsse werden auf die neue Leitung umgebunden.
Vergabe: Beschränkte Ausschreibung nach VOB/A, Vergabenummer WVG-2026-031.
Angebotsfrist: {+8}, 11:00 Uhr
Bieterfragen bis: {+4}
Bindefrist: {+38}
Ausführungsbeginn: {+60}
Fertigstellung: {+150}
Es gelten VOB/B und VOB/C, die DVGW-Arbeitsblätter W 400-1 bis W 400-3, GW 301 und W 291, die ZTV E-StB und die ZTV A-StB. Der Bieter muss die Zertifizierung nach DVGW GW 301, Gruppe W 3 oder höher, nachweisen. Schweißarbeiten an PE-Rohren nur durch Schweißer mit gültiger Prüfung nach DVGW GW 330.
Trasse: 380 m in der Asphaltfahrbahn des Geestwegs, 150 m im gepflasterten Gehweg, 195 m im unbefestigten Seitenstreifen. Regelüberdeckung 1,30 m, Grabentiefe im Mittel 1,50 m.
Baugrund: Nach Auskunft des Verbandes Sande und lehmige Sande. Ein Baugrundgutachten liegt nicht vor.
Verfüllung: Die Wiederverfüllung der Rohrgräben erfolgt im gesamten Trassenverlauf ausschließlich mit Liefermaterial (Füllsand). Aushubboden darf nicht wieder eingebaut werden.
Versorgung: Die Versorgung der Anlieger ist aufrechtzuerhalten. Unterbrechungen sind höchstens 4 Stunden je Tag zulässig und 3 Werktage vorher mit dem Verband abzustimmen und den Anliegern anzukündigen.
Der Geestweg ist Schulbusstrecke. Die Arbeiten erfolgen unter halbseitiger Sperrung.
Verjährungsfrist für Mängelansprüche 4 Jahre. Sicherheit für Mängelansprüche 3 v. H. der Abrechnungssumme.
Abrechnung nach Aufmaß in der Rohrachse."""
