Angebotsfrist: {+8|long}, 11:00 Uhr, per Mail an mich reicht
Fragen bitte bis {+4}
Bindefrist: {+38}
Baubeginn frühestens {+60}, fertig müssen wir bis {+150} sein, danach fängt der Kreis mit der Deckensanierung an

