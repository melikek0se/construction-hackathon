Frage 1:
Nach der Baubeschreibung ist eine Vollsperrung der L 113 ausgeschlossen. Position 1.2.50 sieht jedoch eine Vollsperrung für den Asphalteinbau an 30 Tagen vor. Was gilt?

Antwort 1:
Es bleibt bei der Regelung der Baubeschreibung. Position 1.2.50 ist eine Bedarfsposition für den Fall, dass die Verkehrsbehörde des Kreises einer Vollsperrung an einzelnen Wochenenden zustimmt; ein Anspruch auf Ausführung besteht nicht. Die Position ist anzubieten und wird gewertet.

Frage 2:
In Position 2.3.20 wird der Boden nach Tonnen abgerechnet, der Aushub in Position 2.3.10 nach Kubikmetern. Mit welcher Dichte ist umzurechnen, und werden die Wiegescheine der Annahmestelle anerkannt?

Antwort 2:
Abgerechnet wird nach den Wiegescheinen der Annahmestelle. Eine Umrechnungsdichte wird nicht vorgegeben. Der Menge der Position 2.3.20 liegt eine Dichte von 1,6 t/m³ zugrunde.

Die Angebotsfrist ({+5}, 10:00 Uhr) und alle übrigen Termine bleiben unverändert. Die Frist für Bieterfragen endet am {+1}."""
