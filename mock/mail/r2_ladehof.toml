Bauvorhaben: Sanierung des Ladehofs vor Halle 2, Containerstraße 9, 21129 Hamburg: Erneuerung der Entwässerungsrinne vor den Toren und der Asphaltbefestigung, Fläche ca. 1.870 m2.
