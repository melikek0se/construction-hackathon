name = "Regenwasserkanal und Hofbefestigung Reiterhof Lüders"
project = "Reiterhof Lüders: Regenwasserkanal und Hofbefestigung"
number = ""
remarks = """Positionsliste für die Preisanfrage, aufgestellt vom Bauherrn mit seinem Architekten.
Bauherr: Reiterhof Lüders, Inhaber Henning Lüders, Bilsener Weg 21, 25485 Hemdingen. Die Acme Tiefbau GmbH ist nicht Auftraggeber; die Liste wurde von Jonas Albers weitergeleitet.
Bauvorhaben: Regenwasserkanal vom Stallgebäude zum Vorfluter und Befestigung des Wirtschaftshofs, Fläche ca. 600 m2.
Angebotsfrist: {+12}
Ausführungsbeginn: {+95}
Fertigstellung: {+125}
Der Hof wird von Traktoren mit Anhänger und vom Futtermittel-Lkw (40 t) befahren.
Die Einleitgenehmigung für den Graben liegt vor, Einleitmenge höchstens 15 l/s.
Der Reitbetrieb läuft weiter, die Zufahrt zur Reithalle muss frei bleiben.
Aushubboden kann auf der Koppel hinter der Reithalle eingebaut werden.
Strom und Wasser stellt der Bauherr kostenlos.
Abrechnung nach Aufmaß, Zahlung 14 Tage nach Rechnung."""
items = """
# 1 | Vorarbeiten
1.10 | 1 psch | Baustelle einrichten und räumen | Baustelle einrichten und räumen, einschließlich aller Nebenleistungen und Absperrung gegen den Reitbetrieb.
1.20 | 600 m2 | Alte Hofbefestigung aufnehmen | Vorhandene Befestigung aus Betonplatten, Schotter und Asphaltresten aufnehmen und abfahren, Entsorgung unabhängig von der Belastung des Materials.
# 2 | Regenwasserkanal
2.10 | 118 m | Regenwasserkanal PP DN 300 verlegen | Kanalrohr PP DN 300, SN 8, im Graben bis 1,60 m Tiefe auf Sandbettung verlegen, einschließlich Aushub, Verfüllung und Verdichtung. Aushub auf der Koppel einbauen.
2.20 | 36 m | Kanal wie Position 2.10, jedoch DN 200 | Anschlussleitungen wie Position 2.10, jedoch DN 200, von den Fallrohren und Hofabläufen zum Kanal.
2.30 | 3 St | Kontrollschacht DN 1000 | Schacht aus Betonfertigteilen DN 1000, Tiefe bis 1,80 m, mit Abdeckung Klasse B 125.
2.40 | 5 m2 | Hofablauf mit Schlammeimer | Hofablauf aus Beton mit Gussrost Klasse D 400 und Schlammeimer setzen und anschließen.
2.50 | 1 psch | Auslauf in den Graben | Auslaufbauwerk in den Graben herstellen, Böschung und Sohle sichern, Ausführung nach Vorgabe der Wasserbehörde.
# 3 | Hofbefestigung
3.10 | 600 m2 | Tragschicht aus Schotter 0/45, 30 cm | Schottertragschicht 0/45, Dicke 30 cm, liefern, einbauen und verdichten.
3.20 | 600 m2 | Betonpflaster 8 cm, Fabrikat Störtal Rustika | Betonpflaster 8 cm, Fabrikat Störtal Typ Rustika, Farbe nach Wahl des Bauherrn, auf Splittbettung verlegen, abrütteln und einsanden.
3.30 | 600 m2 | Asphalt statt Pflaster | Alternativ zu Position 3.20: Asphalttragdeckschicht 10 cm. | A
3.40 | - m | Einfassung aus Tiefbordsteinen | Tiefbordsteine 8/25 in Beton setzen.
"""

