2. Betriebsruhe: Unser Haus ist vom {+30} bis einschließlich {+44} geschlossen. Der 14-tägige Probebetrieb der Position 4.1.60 kann in dieser Zeit laufen, wird von uns aber nur über die Fernwirkanlage beobachtet; Einsätze vor Ort sind in diesen Tagen nicht möglich.

3. Kapazitäten: Montage und Inbetriebnahme sind im ersten Quartal durch Aufträge der Wasserwirtschaft weitgehend gebunden. Neue Anfragen können wir nur für eine Ausführung ab KW {kw+110} annehmen und nur, wenn R+I-Schema, Stromlaufpläne und Datenpunktliste der Anfrage beiliegen.

4. Verrechnungssätze: Ab dem 1. Januar gelten 144,00 EUR je Stunde für Monteure und Inbetriebnehmer (bisher 138,00 EUR). Laufende Aufträge werden zu den vereinbarten Sätzen abgerechnet."""
