- Inbetriebnahme mit den Leihpumpen 5,5 kW: einverstanden. Bedingung: Kennlinien und Ex-Bescheinigung der Leihpumpen vor dem Einbau an mich, und der Lieferant bestätigt schriftlich den Liefertermin KW {kw+2} für die endgültigen Pumpen.
- Wenn das Pumpwerk am {-42} mit den Leihpumpen fördert und die Schaltanlage samt Störmeldung auf dem Leitsystem läuft, gilt die Einzelfrist als gewahrt. Keine Vertragsstrafe.
- Nachtrag N 2: Die Hälfte, 3.240,00 EUR netto, übernehmen wir. Mehr nicht, der Verzug bleibt in Ihrer Sphäre.
- Die Gewährleistung für die Pumpen beginnt mit der Abnahme nach dem Probebetrieb, nicht mit dem Einbau der Leihpumpen.
- Fernwirkanbindung: Die zwölf zusätzlichen Datenpunkte und das zweite Prozessbild erkenne ich als Mehrleistung an, Sie hatten das in der Bieterfrage offengelegt. Bitte als Nachtrag N 1 mit Aufgliederung einreichen, die Stunden des Systemlieferanten gegen Nachweis.

Umschluss in der Nacht zum {-42}, Beginn 22:00 Uhr. Unser Betrieb ist mit zwei Mann und dem Saugwagen dabei.

Mit freundlichen Grüßen"""

