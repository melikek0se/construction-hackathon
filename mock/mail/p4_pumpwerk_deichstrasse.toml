„Fabrikat nach Wahl des AG“ und „Anpassungen am Leitsystem einschließlich Prozessbildern ohne gesonderte Vergütung“: Ohne Angabe von Fabrikat und Version des vorhandenen Prozessleitsystems sowie der Zahl der Datenpunkte und Prozessbilder ist die Leistung nicht kalkulierbar. Welches System ist vorhanden, welches Fabrikat der Unterstation wird vorgegeben, und wer nimmt die Eingriffe am Leitsystem vor (Systemlieferant des AG oder der AN)? Wir nehmen an: 40 Datenpunkte, ein Prozessbild, Ausführung am Leitsystem durch den Systemlieferanten im Auftrag des AN.

3. Positionen 3.2.20 und 3.2.50, Horizontalspülbohrung
Position 3.2.50 „Bohrspülung und Bohrklein entsorgen“ ist mit 60 m ausgeschrieben; entsorgt wird nach Volumen oder Gewicht. Wir gehen von 60 m³ aus. Außerdem ergibt der Längsschnitt (Blatt 5) zwischen Start- und Zielgrube eine Bohrlänge von rund 198 m, ausgeschrieben sind in 3.2.20 und 3.2.40 je 185 m. Bitte prüfen Sie die Menge.

Mit freundlichen Grüßen"""

