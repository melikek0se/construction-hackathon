- Werkpläne Pumpschacht mit Auftriebsnachweis zur Freigabe, bevor das Fertigteilwerk produziert
- Pumpenkennlinien, Datenblätter, Ex-Bescheinigung
- Stromlaufpläne Schaltanlage zur Freigabe. Die Fernwirkunterstation ist jetzt festgelegt: Typ wie auf den anderen acht Pumpwerken der Stadt, Bezeichnung und Datenpunktliste (52 Punkte) bekommen Sie in der Besprechung.
- Statik Spundwandverbau, geprüft
- Bohrplanung für die Querung nach GW 321, die Wasserbehörde und der Deichverband wollen sie vier Wochen vor Bohrbeginn sehen

Mit freundlichen Grüßen"""

