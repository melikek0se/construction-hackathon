[[mail]]
id = "behinderung"
day = -66
time = "10:34"
from = "us.albers"
to = "tba.hartwig"
cc = ["us"]
subject = "Pumpwerk Deichstraße – Behinderungsanzeige § 6 Abs. 1 VOB/B: Lieferverzug Tauchmotorpumpen (Pos. 2.2.20)"
body = """Sehr geehrter Herr Hartwig,

der Pumpenlieferant hat uns gestern schriftlich mitgeteilt, dass die beiden Tauchmotorpumpen der Position 2.2.20 nicht wie bestätigt in KW {kw-58}, sondern erst in KW {kw+2} geliefert werden. Grund laut Hersteller: Die explosionsgeschützten Motoren 7,5 kW sind beim Vorlieferanten nicht verfügbar, betroffen ist die gesamte Baureihe. Das Schreiben des Lieferanten füge ich in der Besprechung bei.

Stand der übrigen Leistungen: Pumpschacht versetzt und verfüllt, Edelstahlverrohrung montiert, Druckleitung einschließlich Spülbohrung fertig und geprüft (Protokoll vom {-74}), Schaltanlage wird in KW {kw-52} aufgestellt.

Die Einzelfrist {-40} für die Betriebsbereitschaft ist damit ohne die Pumpen nicht zu halten. Ich zeige hiermit Behinderung nach § 6 Abs. 1 VOB/B an. Wir haben die Pumpen am {-139}, einen Tag nach Ihrer Freigabe, bestellt; den Verzug haben wir nicht zu vertreten.

Herr Doe meldet sich mit einem Vorschlag, wie das Pumpwerk trotzdem vor dem Winter in Betrieb gehen kann.

Mit freundlichen Grüßen"""

[[mail]]
id = "behinderung_aw"
day = -63
time = "07:31"
from = "tba.hartwig"
to = "us.albers"
cc = ["us", "tba.meyer"]
subject = "AW: Pumpwerk Deichstraße – Behinderungsanzeige § 6 Abs. 1 VOB/B: Lieferverzug Tauchmotorpumpen (Pos. 2.2.20)"
reply_to = "behinderung"
body = """Hallo Herr Albers,

so geht das nicht. Die Behinderungsanzeige weise ich zurück. Der Lieferant ist Ihr Nachunternehmer, sein Verzug ist Ihr Risiko und kein Umstand aus dem Bereich des Auftraggebers. § 6 Abs. 2 VOB/B greift hier nicht. Die Einzelfrist {-40} ist Vertragsfrist, die Vertragsstrafe steht im Vertrag.

Mir geht es aber nicht um die Vertragsstrafe, mir geht es darum, dass das alte Pumpwerk im Winter nicht mehr läuft. Die Pumpe 2 dort ist seit drei Wochen ausgefallen, wir fahren mit einer Pumpe ohne Reserve. Ich erwarte bis Ende der Woche einen belastbaren Vorschlag, wie das neue Pumpwerk bis {-40} fördert. Ob mit den endgültigen Pumpen oder anderen, ist mir zunächst gleich.

Mit freundlichen Grüßen"""

[[mail]]
id = "vorschlag"
day = -60
time = "15:48"
from = "us"
to = "tba.hartwig"
cc = ["us.albers", "tba.meyer"]
subject = "Pumpwerk Deichstraße – Vorschlag: Inbetriebnahme mit Leihpumpen bis {-40}, Nachtrag N 2"
reply_to = "behinderung_aw"
quote = false
body = """Sehr geehrter Herr Hartwig,

wir verstehen Ihre Lage und haben mit dem Lieferanten eine Lösung ausgehandelt, mit der das neue Pumpwerk zur Einzelfrist fördert:

1. Der Lieferant stellt ab KW {kw-48} zwei Leihpumpen derselben Baureihe mit dem nächstkleineren Motor (5,5 kW, Ex-Ausführung, 24 l/s bei 14 m) kostenfrei zur Verfügung. Sie passen auf die eingebauten Kupplungsfüße und Führungsrohre. Für den Trockenwetterzufluss von 11 l/s reicht eine Pumpe mit Reserve; bei Regenwetter laufen beide parallel.
2. Die Schaltanlage wird für die Leihpumpen parametriert (Motorschutz, Sanftanlauf). Umschluss vom alten Pumpwerk in der Nacht zum {-42}, wie geplant über Position 1.1.40.
3. Die endgültigen Pumpen werden in KW {kw+2} getauscht, eine Pumpe nach der anderen, ohne Betriebsunterbrechung. Danach beginnt der 14-tägige Probebetrieb der Position 4.1.60. Die Gesamtfertigstellung {+45} bleibt erreichbar.

Kosten: Miete und Transport der Leihpumpen trägt der Lieferant. Bei uns entstehen der zweimalige Aus- und Einbau sowie die zweite Parametrierung und Inbetriebnahme, zusammen 6.480,00 EUR netto (Nachtrag N 2). Wir bieten an, diesen Betrag zur Hälfte selbst zu tragen, wenn die Stadt im Gegenzug die Einzelfrist als gewahrt ansieht, sobald das Pumpwerk mit den Leihpumpen am {-42} in Betrieb ist, und auf die Vertragsstrafe aus der Einzelfrist verzichtet.

Unabhängig davon steht noch der Mehraufwand der Fernwirkanbindung (52 statt 40 Datenpunkte, zwei Prozessbilder) aus unserem Schreiben vom {-120} aus; hierzu bitten wir um Ihre Entscheidung.

Mit freundlichen Grüßen"""

