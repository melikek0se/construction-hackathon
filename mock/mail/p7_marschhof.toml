body = """Sehr geehrte Frau Lührs,

vielen Dank für die Aufforderung. Wir haben die Trasse am {-46} zusammen mit unserem Bohrunternehmen begangen und bitten um Klärung von drei Punkten:

1. Position 3.1.60 „Bohrspülung und Bohrklein entsorgen“
Die Position hat keine Menge (Einheit m3). Bei 1.142 m Bohrlänge und einem Aufweitdurchmesser von rund 280 mm rechnet unser Bohrunternehmen mit etwa 190 m3 Spülung und Bohrklein zur Entsorgung. Bitte nennen Sie die Menge, mit der gewertet wird.

2. Position 3.1.70 „Bohrhindernisse und Baugrundrisiko“, 1 psch
Nach dem Langtext sollen „sämtliche Erschwernisse aus dem Baugrund, insbesondere Hindernisse im Bohrkanal, Spülungsverluste, Ausbläser sowie Abbruch und Neuansatz einer Bohrung“ pauschal und ohne gesonderte Vergütung übernommen werden. Das Baugrundrisiko liegt nach VOB/B und DIN 18324 beim Auftraggeber; ein Neuansatz in Abschnitt 2 kostet für sich einen fünfstelligen Betrag. Bei Sondierungen im Abstand von 150 m ist das nicht kalkulierbar. Wir gehen davon aus, dass die Pauschale nur Erschwernisse abdeckt, die aus dem Baugrundgutachten erkennbar sind (Torf- und Muddelagen), und dass nicht erkennbare Hindernisse nach § 2 Abs. 6 VOB/B vergütet werden. Bitte bestätigen Sie das.

3. Position 1.1.40 „Lastverteilplatten als Baustraße“, 2400 m2
Der Langtext sagt „Abrechnung nach belegter Fläche je Woche Vorhaltung“, die Einheit ist m2 ohne Zeitangabe. Wie viele Wochen sind anzusetzen? Wir nehmen an: 2.400 m2 über 8 Wochen, in einem Einheitspreis je m2. Nach unserer Begehung genügt außerdem eine geringere Fläche, wenn die Platten mit der Bohranlage umgesetzt werden.

Mit freundlichen Grüßen"""

