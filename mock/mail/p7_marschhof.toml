Angebote können schriftlich im verschlossenen Umschlag oder elektronisch in Textform per E-Mail an angebote@wv-geestrand.test abgegeben werden.

Mit dem Angebot vorzulegen: ausgefülltes Leistungsverzeichnis, Zertifikat DVGW GW 302 GN 2 des Bohrunternehmens, DVGW GW 301 des Rohrleitungsbauers, drei Referenzen für Spülbohrungen über 300 m Länge in Weichböden aus den letzten fünf Jahren, Verzeichnis der Nachunternehmer.
