Sehr geehrte Damen und Herren,

der Wasserverband Geestrand bittet Sie um ein Angebot für die oben genannte Leistung.

Angebotsfrist und Eröffnungstermin: {-36|long}, 11:00 Uhr, Geschäftsstelle Am Wasserwerk 3
