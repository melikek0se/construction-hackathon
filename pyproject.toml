[project]
name = "boq"
version = "0.1.0"
description = "BoQ (Leistungsverzeichnis) parsing and rule checks"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.7"]

[project.scripts]
boq = "boq.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
