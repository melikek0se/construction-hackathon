[project]
name = "boq"
version = "0.1.0"
description = "BoQ (Leistungsverzeichnis) parsing and rule checks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pymupdf<1.26",  # newer releases need onnxruntime, which has no wheel for Intel Macs
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
boq = "boq.cli:main"
boq-seed = "boq.seed:main"
boq-mail = "boq.demomail:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
