# Dev environment in one command:
#   docker compose up --watch    → UI http://localhost:5173 (hot reload), API :8000 (auto-reload), Postgres :5432,
#                                  webmail http://localhost:8025/webmail/ on the demo mail server (a mailbox
#                                  per party, password "demo"; kept in Postgres; nothing leaves the laptop)
#                                  (--watch adds: new Python or npm packages are picked up without a restart)
# The production image on this laptop (what Render runs, Postgres in place of Neon):
#   docker compose --profile prod up --build   → http://localhost:8080, password "demo"
# Both use the same database (volume pgdata; `docker compose down -v` wipes it). It starts empty; the six
# dataset projects go in only on request: docker compose exec api boq-seed
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boq"]
      interval: 2s
      retries: 20

  # The mail server of the demo (Stalwart) with its webmail (Roundcube); nothing leaves the laptop. Our firm
  # (kalkulation@polier.test), the client who sends the tender, each supplier and subcontractor have a mailbox
  # here; every password is "demo". The app makes the mailbox of whoever it writes to; others by hand:
  #   docker compose exec mail boq-mail bauherr@client.test
  # Webmail, to be any of them: http://localhost:8025/webmail/ (also under /webmail/ of the app).
  # Mail is kept in Postgres (database boq_mail, volume pgdata) and so outlives restarts. At every start the
  # mock world of mock/mail/ is put in where it is missing (tenders, history with every partner); the app then
  # finds the tenders of the last days in its inbox and reads them, which asks Claude. DEMO_MAIL_FILL=0: not.
  mail:
    build: {context: ., target: mail}
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/boq
      DEMO_MAIL_FILL: ${DEMO_MAIL_FILL:-1}
      DEMO_MAIL_URL: http://127.0.0.1:8090  # for `docker compose exec mail boq-mail …`
    volumes:
      - ./src:/app/src        # boq-mail and the mock world as they are in the working folder
      - ./mock:/app/mock:ro
    ports: ["8025:8081", "3025:3025", "3143:3143"]  # webmail; SMTP and IMAP for a mail program or a script
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8090/healthz/live"]
      interval: 2s
      retries: 60

  api:
    build: {context: ., target: dev}
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_healthy}
    env_file: [.env]  # ANTHROPIC_API_KEY; the lines below win over it
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/boq
      # The app's own mailbox: the firm's account on the mail server above, unless .env names a real one
      # (SMTP_HOST=…, IMAP_HOST=… with their users and passwords, IMAP_TLS=1 and DEMO_MAIL_URL=off).
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-3025}
      SMTP_USER: ${SMTP_USER:-kalkulation@polier.test}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-demo}
      SMTP_FROM: ${SMTP_FROM:-kalkulation@polier.test}
      IMAP_HOST: ${IMAP_HOST:-mail}
      IMAP_PORT: ${IMAP_PORT:-3143}
      IMAP_USER: ${IMAP_USER:-kalkulation@polier.test}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-demo}
      IMAP_TLS: ${IMAP_TLS:-0}
      DEMO_MAIL_URL: ${DEMO_MAIL_URL:-http://mail:8090}  # where the app makes mailboxes for those it writes to
      WEBMAIL_URL: http://mail:8081                       # served by the app under /webmail/
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./dataset:/app/dataset:ro
      - ./mock:/app/mock:ro  # the mock mail: docker compose exec api boq-mail --fill
      - ./data:/app/data  # pages drawn for the PDF view; data/cache/llm for boq-seed
    ports: ["${API_PORT:-8000}:8000"]
    develop:  # code reloads through the mounts above; a new dependency rebuilds the image
      watch:
        - {action: rebuild, path: pyproject.toml}
        - {action: rebuild, path: uv.lock}

  web:
    image: node:22-slim
    working_dir: /web
    environment:
      API_URL: http://api:8000  # vite.config.ts sends /api there
    volumes:
      - ./web:/web
      - web_modules:/web/node_modules  # Linux packages, kept apart from the Mac's web/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    depends_on: [api]
    ports: ["${WEB_PORT:-5173}:5173"]
    develop:  # a new npm package: restart, which runs npm ci again
      watch:
        - {action: restart, path: web/package-lock.json}

  app:
    profiles: [prod]
    build: {context: ., target: prod}
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/boq
      BOQ_PASSWORD: ${BOQ_PASSWORD:-demo}
      DEMO_MAIL: "1"  # mail server and webmail inside this container, as on Render (docker/start.sh)
      DEMO_MAIL_DATABASE: boq_mail_prod  # its own mailboxes: two mail servers must not share one database
    mem_limit: 512m  # what Render's free instance has
    ports: ["8080:8000"]

volumes:
  pgdata:
  web_modules:
