<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polier · what it says</title>
<style>
  @font-face { font-family: Barlow; font-weight: 400; src: url(fonts/barlow-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Barlow; font-weight: 600; src: url(fonts/barlow-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Barlow; font-weight: 700; src: url(fonts/barlow-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2"); }
  :root { --yellow: #ffc400; --ink: #121413; --mute: #5f635c; --hover: #fff7cf; --text: Barlow, system-ui, sans-serif; --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
          --ease: cubic-bezier(0.16, 1, 0.3, 1); --pop: cubic-bezier(0.34, 1.56, 0.64, 1); --stripe: repeating-linear-gradient(-45deg, var(--ink) 0 9px, var(--yellow) 9px 18px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* the board as it stands on the dev stack, as a picture */
  body { font: 400 14px/1.45 var(--text); color: var(--ink); background: #fff url(board.png) right bottom / 1500px 950px no-repeat; }
  ::selection { background: var(--yellow); }
  button { font: inherit; color: inherit; cursor: pointer; }

  .pg { position: fixed; left: 0; top: 0; z-index: 80; width: 300px; max-height: 100%; overflow: auto; background: var(--ink); color: #fff; padding: 14px 14px 18px; }
  .pg h1 { margin: 0 0 4px; font: 700 12px var(--text); letter-spacing: .1em; text-transform: uppercase; }
  .pg p { margin: 0 0 10px; font-size: 12.5px; color: #c9ccc3; }
  .pg h2 { margin: 14px 0 6px; font: 600 11px var(--text); letter-spacing: .1em; text-transform: uppercase; color: #a9aca4; }
  .pg button { display: block; width: 100%; margin: 0 0 4px; padding: 7px 9px; text-align: left; font: 600 12.5px var(--text); color: #e8eae3; background: none; border: 1px solid #5f635c; border-radius: 2px; }
  .pg button:hover { background: #2c2f2b; }
  .pg button[aria-pressed="true"], .pg button.go { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
  .pg button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  .pg small { display: block; margin-top: 10px; font-size: 12px; color: #a9aca4; }

  /* the mascot of the picture, cut out so that it can move: it hops when it has something to say */
  .patch, .mascot { position: fixed; right: 26px; bottom: 8px; width: 116px; height: 118px; clip-path: ellipse(55px 57px at 50% 52%); }
  .patch { background: #fff; z-index: 40; }
  .mascot { z-index: 56; background: url(board.png) calc(100% + 26px) calc(100% + 8px) / 1500px 950px no-repeat; transform-origin: 50% 100%; }
  .mascot.hop { animation: hop 620ms var(--ease); }
  @keyframes hop { 0% { transform: translateY(0) scale(1, 1); } 18% { transform: translateY(0) scale(1.08, 0.9); } 45% { transform: translateY(-26px) scale(0.96, 1.06) rotate(-6deg); } 72% { transform: translateY(0) scale(1.06, 0.93); } 100% { transform: none; } }
  .mascot.cheer { animation: cheer 1100ms var(--ease); }
  @keyframes cheer { 0% { transform: none; } 15% { transform: translateY(0) scale(1.1, 0.86); } 35% { transform: translateY(-40px) rotate(-10deg); } 55% { transform: translateY(0) scale(1.08, 0.9); } 72% { transform: translateY(-22px) rotate(8deg); } 100% { transform: none; } }

  .says { position: fixed; z-index: 55; }
  .says button { background: none; border: 0; padding: 0; }
  .x { width: 24px; height: 24px; display: grid; place-items: center; margin-left: auto; flex: none; }
  .word { display: inline-block; opacity: 0; transform: translateY(6px); animation: word 260ms var(--ease) forwards; }
  @keyframes word { to { opacity: 1; transform: none; } }
  .timer { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; transform-origin: 0 50%; animation: timer 14s linear forwards; }
  .says:hover .timer { animation-play-state: paused; }
  @keyframes timer { to { transform: scaleX(0); } }
  .gone { animation: gone 220ms ease-in forwards !important; }
  @keyframes gone { to { opacity: 0; transform: translate(40px, 30px) scale(0.3); } }

  /* ---- A: a sticker slapped up beside the hat. Yellow, loud, a little crooked. */
  .a { right: 150px; bottom: 58px; width: min(380px, calc(100vw - 190px)); background: var(--yellow); border: 3px solid var(--ink); padding: 0 14px 16px; transform-origin: 100% 100%; rotate: -2deg; animation: slap 520ms var(--pop) both; }
  @keyframes slap { from { opacity: 0; transform: translate(60px, 40px) scale(0.2) rotate(14deg); } }
  .a::before { content: ""; display: block; height: 9px; margin: 0 -14px 10px; background: var(--stripe); border-bottom: 2px solid var(--ink); }
  .a::after { content: ""; position: absolute; right: -19px; bottom: 16px; width: 0; height: 0; border: solid transparent; border-width: 11px 0 11px 18px; border-left-color: var(--ink); }
  .a .tail { position: absolute; right: -12px; bottom: 19px; z-index: 1; border: solid transparent; border-width: 8px 0 8px 13px; border-left-color: var(--yellow); }
  .a .top { display: flex; gap: 10px; align-items: flex-start; }
  .a .icon { flex: none; width: 38px; height: 38px; background: var(--ink); color: var(--yellow); display: grid; place-items: center; animation: stamp 420ms var(--pop) 180ms both; }
  @keyframes stamp { from { transform: scale(2.2) rotate(-20deg); opacity: 0; } }
  .a h3 { margin: 0; font: 700 28px/1 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
  .a .more { font: 700 11px var(--text); letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--yellow); padding: 2px 6px; margin-top: 4px; display: inline-block; }
  .a .x:hover { background: var(--ink); color: var(--yellow); }
  .a p { margin: 8px 0 0; font-size: 14px; font-weight: 500; }
  .a .open { margin-top: 12px; height: 30px; padding: 0 12px; background: var(--ink); color: var(--yellow); font: 700 12px var(--text); letter-spacing: .08em; text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 2px; }
  .a .open:hover { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .a .timer { background: var(--ink); }

  /* ---- B: Polier pulls a barrier tape out of the corner; the news hangs under it. */
  .b { right: 96px; bottom: 96px; width: min(560px, calc(100vw - 130px)); rotate: -3deg; transform-origin: 100% 50%; }
  .b .tape { height: 46px; background: var(--yellow); border: 1px solid var(--ink); position: relative; overflow: hidden; transform-origin: 100% 50%; animation: pull 480ms var(--ease) both; }
  @keyframes pull { from { transform: scaleX(0); } }
  .b .tape::before, .b .tape::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; background: var(--stripe); }
  .b .tape::before { top: 0; } .b .tape::after { bottom: 0; }
  .b .run { position: absolute; top: 9px; bottom: 9px; left: 0; display: flex; align-items: center; white-space: nowrap; font: 600 17px var(--cond); letter-spacing: .14em; text-transform: uppercase; animation: run 1100ms var(--ease) both; }
  .b .run span { padding: 0 18px; } .b .run i { width: 7px; height: 7px; background: var(--ink); flex: none; }
  /* the lettering comes with the tape as it is pulled out, then stands: it does not keep running */
  @keyframes run { from { transform: translateX(-18%); } to { transform: translateX(-6%); } }
  .b .plate { margin: 0 34px 0 auto; width: min(400px, 86%); background: #fff; border: 2px solid var(--ink); border-top: 0; padding: 12px 14px 16px; position: relative; transform-origin: 50% 0; animation: drop 460ms var(--pop) 380ms both; }
  @keyframes drop { from { transform: scaleY(0); opacity: 0; } }
  .b .top { display: flex; align-items: center; gap: 8px; }
  .b .more { font: 600 12px var(--text); color: var(--mute); }
  .b .x:hover { background: var(--hover); }
  .b p { margin: 4px 0 0; font-size: 14px; }
  .b .open { margin-top: 10px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; text-align: left; }
  .b .timer { background: var(--yellow); border-top: 1px solid var(--ink); height: 6px; }

  /* ---- C: the site radio. Polier calls it in; the line comes letter by letter. */
  .c { right: 150px; bottom: 62px; width: min(390px, calc(100vw - 190px)); background: var(--ink); color: #fff; padding: 12px 14px 16px; border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--yellow); transform-origin: 100% 100%; animation: radio 380ms var(--pop) both; }
  @keyframes radio { from { opacity: 0; transform: translateX(30px) scale(0.6); } }
  .c::after { content: ""; position: absolute; right: -16px; bottom: 16px; border: solid transparent; border-width: 10px 0 10px 15px; border-left-color: var(--ink); }
  .c .top { display: flex; align-items: center; gap: 10px; }
  .c .call { font: 700 12px var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); }
  .c .bars { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
  .c .bars i { width: 3px; height: 100%; background: var(--yellow); transform-origin: 50% 100%; animation: bar 700ms ease-in-out infinite alternate; }
  .c .bars i:nth-child(2) { animation-delay: -200ms; } .c .bars i:nth-child(3) { animation-delay: -430ms; } .c .bars i:nth-child(4) { animation-delay: -90ms; }
  .c.done .bars i { animation: none; transform: scaleY(0.25); }
  @keyframes bar { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
  .c .more { font: 600 12px var(--text); color: #a9aca4; }
  .c .x { color: #fff; } .c .x:hover { background: #2c2f2b; }
  .c h3 { margin: 8px 0 0; font: 700 24px/1.05 var(--cond); letter-spacing: .03em; text-transform: uppercase; color: var(--yellow); }
  .c p { margin: 6px 0 0; font-size: 14px; min-height: 2.9em; }
  .c .caret { display: inline-block; width: 8px; height: 15px; margin-left: 2px; background: var(--yellow); vertical-align: -2px; animation: blink 700ms steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .c .open { margin-top: 12px; height: 30px; padding: 0 12px; background: var(--yellow); color: var(--ink); font: 700 12px var(--text); letter-spacing: .08em; text-transform: uppercase; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 2px; opacity: 0; transition: opacity 200ms; }
  .c.done .open { opacity: 1; }
  .c .open:hover { background: #fff; }
  .c .timer { background: var(--yellow); left: 2px; right: 2px; bottom: 2px; }

  /* a contract won: square confetti out of the corner. Squares only. */
  .bit { position: fixed; right: 70px; bottom: 90px; z-index: 57; width: var(--s); height: var(--s); background: var(--c); border: 1px solid var(--ink); animation: fly var(--t) cubic-bezier(0.2, 0.7, 0.4, 1) forwards; }
  @keyframes fly { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 60% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
<nav class="pg" aria-label="Demo controls">
  <h1>What Polier says</h1>
  <p>Three ways for Polier to speak up. The board behind is a picture; the mascot is cut out of it so it can hop.</p>
  <h2>How it speaks</h2>
  <button data-v="a" aria-pressed="true">A · Sticker: loud, yellow, crooked</button>
  <button data-v="b" aria-pressed="false">B · Tape pulled out of the corner</button>
  <button data-v="c" aria-pressed="false">C · Site radio, letter by letter</button>
  <h2>Something happens</h2>
  <button data-n="0">A new tender comes in</button>
  <button data-n="1">The client sends the LV again</button>
  <button data-n="3">An award comes in (won!)</button>
  <button data-n="4">A supplier answers</button>
  <button data-n="5">A supplier asks back</button>
  <button data-n="6">The client answers a question</button>
  <button data-n="7">"Check mail" finds nothing</button>
  <button class="go" data-all>The morning's mail: four in a row</button>
  <small>A bubble goes after 14 s (the bar at its foot) unless the pointer rests on it.</small>
</nav>
<div class="patch"></div>
<div class="mascot" id="mascot"></div>
<div id="slot"></div>
<script>
// `shout`: what Polier calls out; `text`: the sentence, in its own voice. The tenders are the mock world's.
const NEWS = [
  { kind: "mail", shout: "New tender!", project: "TBA-2026-114 Mischwasserkanal Birkenweg", text: "Look what I found in your mail: Stadt Norderbek wants a bid for the sewer and road works in Birkenweg, due 07.12. That is exactly your kind of work." },
  { kind: "again", shout: "The LV changed!", project: "TBA-2026-114 Mischwasserkanal Birkenweg", text: "The client sent the LV again. I read it for you: 9 items changed or new, 1 dropped, and the deadline moved to 10.12. Your prices and questions came along." },
  { kind: "bid", shout: "Bid on file.", project: "HLP-H2-2026-07 Ladehof Halle 2", text: "I put the bid as it went out next to its tender." },
  { kind: "won", shout: "You won it!", project: "HLP-H2-2026-07 Ladehof Halle 2", text: "The award for Ladehof Halle 2 is in: 171.789,50 €. Careful, it is not your bid one to one: one item gone, one new, one price changed." },
  { kind: "quote", shout: "Prices are in!", project: "TBA-2026-114 Mischwasserkanal Birkenweg", text: "Rohrhandel Nord answered: all 6 pipe items priced, 4 % off, free to site. That beats the other quote by 1.240 €." },
  { kind: "asks", shout: "They ask back.", project: "TBA-2026-114 Mischwasserkanal Birkenweg", text: "Nordbeton wants to know before quoting: which load class for the DN 900 pipes? I drafted an answer from the LV for you to check." },
  { kind: "answer", shout: "The client answered!", project: "TBA-2026-114 Mischwasserkanal Birkenweg", text: "2 of 3 questions answered. One changes a quantity: item 6.1.40 is 860 m², the print-out was wrong. Yours to decide." },
  { kind: "none", shout: "All quiet.", project: "", text: "I looked through your mail. Nothing new for now." },
];
const ICON = {
  mail: '<path d="M3 6h18v12H3z M3 6l9 7 9-7" />', again: '<path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2-2a5 5 0 0 0-9 3 M20 12a8 8 0 0 1-14 5l-2 2v-6h6l-2 2a5 5 0 0 0 9-3" />',
  bid: '<path d="M6 3h9l4 4v14H6z M15 3v4h4 M9 12h7 M9 16h7" />', won: '<path d="M7 4h10v5a5 5 0 0 1-10 0z M7 6H4v2a3 3 0 0 0 3 3 M17 6h3v2a3 3 0 0 1-3 3 M12 14v4 M8 20h8" />',
  quote: '<path d="M4 7h16v10H4z M8 12h2 M12 12h4 M4 10h16" />', asks: '<path d="M9 9a3 3 0 1 1 4 3c-1 .6-1 1.2-1 2 M12 18v.5" />',
  answer: '<path d="M4 5h16v11H10l-4 3v-3H4z M8 10l3 3 5-6" />', none: '<path d="M5 12h14" />',
};
const STAYS_MS = 14000;
let variant = "a", queue = [], timer = null, typing = null, seq = 0;
const slot = document.getElementById("slot"), mascot = document.getElementById("mascot");
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const X = '<svg width="11" height="11" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1 1 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></svg>';
const words = (t, from = 0) => t.split(" ").map((w, i) => `<span class="word" style="animation-delay:${from + i * 34}ms">${esc(w)}</span>`).join(" ");
const icon = (k) => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">${ICON[k]}</svg>`;

function hop(cheer) {
  mascot.className = "mascot";
  void mascot.offsetWidth;
  mascot.className = `mascot ${cheer ? "cheer" : "hop"}`;
}
function confetti() {
  for (let i = 0; i < 34; i++) {
    const b = document.createElement("i");
    b.className = "bit";
    const a = Math.PI * (0.55 + Math.random() * 0.75), d = 140 + Math.random() * 300;
    b.style.cssText = `--s:${6 + Math.round(Math.random() * 8)}px;--c:${["#ffc400", "#121413", "#fff"][i % 3]};--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(-Math.sin(a) * d + 120)}px;--r:${Math.round(Math.random() * 720 - 360)}deg;--t:${900 + Math.round(Math.random() * 700)}ms;animation-delay:${Math.round(Math.random() * 160)}ms`;
    document.body.append(b);
    setTimeout(() => b.remove(), 2000);
  }
}
function gone() {
  clearTimeout(timer);
  clearInterval(typing);
  const el = slot.firstElementChild;
  if (!el) return;
  el.classList.add("gone");
  setTimeout(() => { queue.shift(); draw(); }, 200);
}
function draw() {
  clearTimeout(timer);
  clearInterval(typing);
  const now = queue[0];
  if (!now) return void (slot.innerHTML = "");
  const more = queue.length > 1 ? `${queue.length - 1} more` : "";
  const open = now.project ? `<button class="open">Open ${esc(now.project)}</button>` : "";
  if (variant === "a")
    slot.innerHTML = `<aside class="says a" role="status"><i class="tail"></i><div class="top"><span class="icon">${icon(now.kind)}</span><div><h3>${words(now.shout, 120)}</h3>${more && `<span class="more">${more}</span>`}</div><button class="x" aria-label="Dismiss">${X}</button></div><p>${words(now.text, 320)}</p>${open}<i class="timer"></i></aside>`;
  else if (variant === "b") {
    const lap = `<span>${esc(now.shout)}</span><i></i>`.repeat(8);
    slot.innerHTML = `<aside class="says b" role="status"><div class="tape"><div class="run">${lap}${lap}</div></div><div class="plate"><div class="top"><span class="more">${more}</span><button class="x" aria-label="Dismiss">${X}</button></div><p>${words(now.text, 620)}</p>${open}<i class="timer"></i></div></aside>`;
  } else {
    slot.innerHTML = `<aside class="says c" role="status"><div class="top"><span class="bars"><i></i><i></i><i></i><i></i></span><span class="call">Polier calling</span><span class="more">${more}</span><button class="x" aria-label="Dismiss">${X}</button></div><h3>${esc(now.shout)}</h3><p><span class="line"></span><i class="caret"></i></p>${open}<i class="timer"></i></aside>`;
    const line = slot.querySelector(".line"), el = slot.firstElementChild;
    let n = 0;
    typing = setInterval(() => {
      n += 2;
      line.textContent = now.text.slice(0, n);
      if (n >= now.text.length) { clearInterval(typing); el.classList.add("done"); el.querySelector(".caret").remove(); }
    }, 22);
  }
  const el = slot.firstElementChild;
  el.querySelector(".x").onclick = gone;
  const o = el.querySelector(".open");
  if (o) o.onclick = gone;
  el.onmouseenter = () => clearTimeout(timer);
  el.onmouseleave = () => (timer = setTimeout(gone, 4000));
  timer = setTimeout(gone, STAYS_MS);
  hop(now.kind === "won");
  if (now.kind === "won") setTimeout(confetti, 260);
}
function say(n) {
  queue.push({ ...NEWS[n], id: ++seq });
  if (queue.length === 1) draw();
  else {
    const m = slot.querySelector(".more");
    if (m) m.textContent = `${queue.length - 1} more`;
    hop(false); // it has more to say
  }
}
document.querySelector(".pg").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.v) {
    variant = b.dataset.v;
    for (const x of document.querySelectorAll("[data-v]")) x.setAttribute("aria-pressed", x === b);
    if (queue.length) draw(); else say(0);
  } else if (b.dataset.all !== undefined) [0, 1, 4, 3].forEach((n, i) => setTimeout(() => say(n), i * 700));
  else say(Number(b.dataset.n));
});
if (["a", "b", "c"].includes(location.hash.slice(1))) {
  variant = location.hash.slice(1);
  for (const x of document.querySelectorAll("[data-v]")) x.setAttribute("aria-pressed", x.dataset.v === variant);
}
setTimeout(() => say(0), 800);
</script>
</body>
</html>
