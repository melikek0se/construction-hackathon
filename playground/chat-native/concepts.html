<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Polier and the conversation: where he stands, what he does</title>
<link rel="icon" href="../chat-panel/favicon.svg" />
<style>
@font-face { font-family: Barlow; font-weight: 400; src: url(../tender/fonts/barlow-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Barlow; font-weight: 500; src: url(../tender/fonts/barlow-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Barlow; font-weight: 600; src: url(../tender/fonts/barlow-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: Barlow; font-weight: 700; src: url(../tender/fonts/barlow-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(../tender/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(../tender/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2"); }

:root {
  --yellow: #ffc400; --ink: #121413; --ink-2: #3b403a; --red: #c4161c;
  --rule: #e3e3dd; --line-2: #c4c4bc; --tint: #f6f6f2; --hover: #fff7cf; --mute: #5f635c; --dim: #8b8e87;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --text: "Barlow", system-ui, sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1); --hop: cubic-bezier(0.34, 1.4, 0.64, 1);
  --stripe: repeating-linear-gradient(-45deg, var(--ink) 0 8px, var(--yellow) 8px 16px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 14px/1.45 var(--text); color: var(--ink); background: #2a2c2a; display: flex; flex-direction: column; overflow: hidden; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
p, h3, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
::selection { background: var(--yellow); color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- the switcher (not part of the design) ---------- */
.switcher { flex: none; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 7px 14px; background: #1d1f1e; color: #ddd; font-size: 12px; }
.switcher b { color: #fff; margin: 0 4px 0 0; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.switcher button, .switcher a { padding: 5px 10px; border: 1px solid #444; background: #2a2d2b; color: #ddd; text-decoration: none; }
.switcher button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); border-color: var(--yellow); font-weight: 700; }
.switcher .gap { width: 12px; }
.switcher a { margin-left: auto; }
.note { flex: none; padding: 6px 14px 7px; background: #262826; color: #c9c9c2; font-size: 12.5px; line-height: 1.35; border-top: 1px solid #333; }
.note b { color: var(--yellow); font-weight: 600; }

/* ---------- the artboard: the real tender page (a screenshot) at 1440 x 860, scaled to the window ---------- */
.fit { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.board { position: absolute; left: 0; top: 0; width: 1440px; height: 860px; transform-origin: 0 0; background: #fff; overflow: hidden; }
.bg { position: absolute; left: 0; top: 0; height: 860px; }
.bg.side { width: 980px; opacity: 0; }
.bg.full { width: 1440px; }
.board.room .bg.side { opacity: 1; }
.board.room .bg.full { opacity: 0; }

/* ---------- pieces, as the app draws them ---------- */
.lab { font: 600 11px var(--text); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.plate { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; background: var(--yellow); color: var(--ink); font: 600 16px/1 var(--display); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px; border-radius: 2px; font: 700 12px var(--text); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; transition: background .12s var(--ease), color .12s var(--ease); }
.btn.primary { background: var(--yellow); color: var(--ink); }
.btn.primary:hover { background: var(--ink); color: var(--yellow); }
.fn { display: inline-grid; place-items: center; width: 15px; height: 15px; margin: 0 1px 0 2px; background: var(--yellow); color: var(--ink); font: 700 11px/1 var(--display); vertical-align: 2px; cursor: pointer; transition: background .12s, color .12s; }
.fn:hover, .fn.lit { background: var(--ink); color: var(--yellow); }
.tag { display: inline-block; padding: 0 5px; border: 1px solid var(--line-2); font: 600 10.5px/1.6 var(--text); letter-spacing: .08em; text-transform: uppercase; color: #3f433d; }
.tok { color: var(--mute); border-bottom: 1px dotted var(--dim); }
mark { background: none; color: inherit; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.bars i { width: 3px; height: 100%; background: var(--yellow); transform-origin: 50% 100%; transform: scaleY(.25); }
.bars i:nth-child(2) { transform: scaleY(.5); } .bars i:nth-child(3) { transform: scaleY(.75); } .bars i:nth-child(4) { transform: none; }
.live .bars i { animation: bar .7s ease-in-out infinite alternate; }
.live .bars i:nth-child(2) { animation-delay: -.2s; } .live .bars i:nth-child(3) { animation-delay: -.43s; } .live .bars i:nth-child(4) { animation-delay: -.09s; }
@keyframes bar { from { transform: scaleY(.2); } to { transform: scaleY(1); } }
@keyframes run { to { background-position: 34px 0; } }
.rise { animation: rise .32s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.caret { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: var(--yellow); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.strip { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
.strip i { flex: 1 1 0; height: 14px; background: var(--rule); }
.strip i.sec { margin-left: 5px; }
.strip i.on { flex: 0 0 18px; height: 22px; display: grid; place-items: center; background: var(--yellow); box-shadow: inset 0 0 0 1.5px var(--ink); font: 700 12px/1 var(--display); font-style: normal; cursor: pointer; }
.strip i.on:hover, .strip i.on.lit { background: var(--ink); color: var(--yellow); }

/* ---------- Polier: one figure that moves between its places; the inner picture carries the pose ---------- */
#pol { position: absolute; z-index: 30; left: 1290px; top: 712px; width: 134px; height: 128px; cursor: pointer; transition: left .6s var(--hop), top .6s var(--hop), width .6s var(--hop), height .6s var(--hop); }
#pol img { display: block; width: 100%; transform-origin: 50% 96%; filter: drop-shadow(0 3px 1px rgba(0, 0, 0, .14)); animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(1.2deg); } }
[data-s="typing"] #pol img { animation: none; transform: rotate(var(--lean, -11deg)) translateX(var(--lean-x, -7px)); transition: transform .3s var(--hop); }
[data-s="reading"] #pol img { animation: think .7s ease-in-out infinite; }
@keyframes think { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-4px); } }
[data-s="answer"] #pol img { animation: hop .55s var(--ease) 1, bob 3.2s ease-in-out .55s infinite; }
@keyframes hop { 0% { transform: scale(1.08, .88); } 40% { transform: translateY(-22px) scale(.95, 1.06); } 75% { transform: scale(1.05, .93); } 100% { transform: none; } }
[data-s="none"] #pol img { animation: none; transform: rotate(15deg) translateY(2px); transition: transform .35s var(--hop); }

/* ---------- Polier's call: the ink plate of his radio calls (says.css) ---------- */
.call { position: relative; padding: 11px 14px 13px; background: var(--ink); color: #fff; border: 2px solid var(--ink); box-shadow: inset 0 0 0 2px var(--yellow); }
.call .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font: 700 11.5px var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--yellow); }
.call .top span:last-child { margin-left: auto; color: #a9aca4; letter-spacing: .08em; }
.call p { line-height: 1.45; }
.call .tag { margin-bottom: 6px; border-color: #6b6e67; color: #d6d6cf; }
.call .ex { margin-top: 10px; border-top: 1px solid #3a3d39; }
.call .ex button { display: flex; gap: 10px; align-items: baseline; width: 100%; padding: 7px 4px; border-bottom: 1px solid #3a3d39; color: #fff; font-weight: 500; transition: background .12s, color .12s; }
.call .ex button::before { content: "›"; color: var(--yellow); font: 700 15px/1 var(--display); }
.call .ex button:hover { background: var(--yellow); color: var(--ink); }
.call .ex button:hover::before { color: var(--ink); }
.call.tail-r::after { content: ""; position: absolute; right: -16px; bottom: 14px; border: solid transparent; border-width: 10px 0 10px 15px; border-left-color: var(--ink); }
.call .tok { color: #a9aca4; border-color: #6b6e67; }

/* ---------- the ask plate: where you type; white, ink keyline, yellow when it has the cursor ---------- */
.askp { position: relative; display: flex; align-items: flex-end; background: #fff; border: 2px solid var(--ink); }
.askp:focus-within { box-shadow: 0 0 0 3px var(--yellow); }
.askp textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 110px; field-sizing: content; padding: 11px 12px; border: 0; outline: 0; resize: none; background: none; line-height: 20px; }
.askp button { flex: none; margin: 5px; }

/* ---------- the stack beside Polier in his corner: his greeting above, your plate below (1 and 3) ---------- */
.stack { position: absolute; z-index: 20; right: 166px; bottom: 26px; width: 404px; display: none; flex-direction: column; gap: 8px; transform-origin: 100% 100%; animation: pop .34s var(--hop) both; }
@keyframes pop { from { opacity: 0; transform: translateX(26px) scale(.7); } }
.stack .askp::after { content: ""; position: absolute; right: -15px; bottom: 12px; border: solid transparent; border-width: 9px 0 9px 13px; border-left-color: var(--ink); }
.stack .hist { display: flex; align-items: center; gap: 4px; }
.stack .hist .lab { margin-right: 4px; background: #fff; padding: 0 4px; }
.stack .hist button.plate[aria-current="true"] { background: var(--ink); color: var(--yellow); }

/* ---------- the body of an answer, shared by the panels of 1 and 2 ---------- */
.log { flex: 1; min-height: 0; overflow: hidden auto; padding: 0 20px; scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
.t { padding: 16px 0 14px; border-bottom: 2px solid var(--ink); }
.t:last-child { border-bottom: 0; }
.t h3 { margin-top: 4px; font: 600 22px/1.08 var(--display); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.t .where { margin-top: 12px; }
.t .where .lab { display: flex; justify-content: space-between; margin-bottom: 5px; }
.t .ans { margin-top: 12px; font-size: 15px; line-height: 1.55; }
.t .ans mark { font-weight: 600; box-shadow: inset 0 -2px 0 var(--yellow); }
.t .tag { margin-top: 12px; }
.t .tag + .ans { margin-top: 6px; }
.cuts { display: grid; gap: 6px; margin-top: 12px; }
.cuts button { display: grid; grid-template-columns: 15px minmax(0, 1fr); gap: 4px 9px; width: 100%; padding: 8px 10px 9px 9px; background: var(--tint); border-left: 3px solid var(--yellow); transition: background .12s, box-shadow .12s; }
.cuts button:hover, .cuts button.lit { background: var(--hover); box-shadow: inset 0 0 0 1px var(--ink); }
.cuts .fn { margin: 2px 0 0; vertical-align: 0; }
.cuts .h { display: flex; gap: 10px; align-items: baseline; }
.cuts b { font: 600 13.5px var(--text); font-variant-numeric: tabular-nums; }
.cuts .f { margin-left: auto; font-size: 11.5px; color: var(--dim); }
.cuts .q { grid-column: 2; font-size: 13.5px; line-height: 1.45; }
.cuts .q mark, .call .q mark { background: var(--yellow); color: var(--ink); padding: 0 1px; }
.t .foot { margin-top: 10px; font-size: 11.5px; color: var(--dim); }
.t .wait { margin-top: 12px; }

/* the panel head: the band runs on across the panel, Polier's plate in it like Engine room and Partners */
.panel { position: absolute; z-index: 10; top: 0; right: 0; width: 460px; display: none; flex-direction: column; background: #fff; border-left: 2px solid var(--ink); }
.head { flex: none; height: 70px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 18px; background: var(--ink); color: #fff; border-block: 9px solid; border-image: var(--stripe) 9; }
.p-stay .head { box-shadow: inset 2px 0 0 var(--yellow); }
.head .who { flex: 1; min-width: 0; display: grid; gap: 2px; }
.head strong { font: 700 22px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.head .who span { font-size: 12px; line-height: 1.2; color: #d6d6cf; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .x { width: 34px; height: 34px; display: grid; place-items: center; color: #fff; }
.head .x:hover { background: var(--yellow); color: var(--ink); }

/* =============== 1 · YERINDE: Polier keeps his corner and his size; the conversation is built around him =============== */
[data-v="stay"]:is([data-s="invite"], [data-s="typing"]) .stack { display: flex; }
[data-v="stay"]:is([data-s="reading"], [data-s="answer"], [data-s="none"]) .p-stay { display: flex; bottom: 0; animation: slide .45s var(--ease) both; }
@keyframes slide { from { transform: translateX(100%); } }
[data-v="stay"]:is([data-s="reading"], [data-s="answer"], [data-s="none"]) #pol { left: 1298px; top: 724px; }
/* the stand: his floor is the hazard stripe (it runs while he reads), your plate beside him, what he is doing above it */
.stand { flex: none; position: relative; height: 150px; padding: 12px 152px 0 18px; border-top: 2px solid var(--ink); display: flex; flex-direction: column; }
.stand::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: repeating-linear-gradient(-45deg, var(--ink) 0 12px, var(--yellow) 12px 24px); background-size: 34px 100%; }
[data-s="reading"] .stand::after { animation: run .7s linear infinite; }
.stand .doing { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; font-size: 12px; color: var(--mute); line-height: 1.35; }
.stand .doing .lab { display: flex; align-items: center; gap: 7px; color: var(--ink); }
.stand .doing .bars i { background: var(--ink); }
.stand .doing u { text-decoration-thickness: 1px; text-underline-offset: 3px; font-weight: 600; color: var(--ink); cursor: pointer; }
.stand .askp { margin-bottom: 23px; }
.stand .askp::after { content: ""; position: absolute; right: -15px; bottom: 12px; border: solid transparent; border-width: 9px 0 9px 13px; border-left-color: var(--ink); }

/* =============== 2 · BANTTA: he hops up into the band; the panel hangs under him like a shutter =============== */
[data-v="band"]:not([data-s="closed"]) .p-band { display: flex; animation: drop .5s var(--ease) both; }
@keyframes drop { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
[data-v="band"]:is([data-s="reading"], [data-s="answer"], [data-s="none"]) .p-band { bottom: 0; }
[data-v="band"]:not([data-s="closed"]) #pol { left: 992px; top: 15px; width: 98px; height: 94px; --lean: 12deg; --lean-x: 4px; }
.p-band .head { padding-left: 118px; }
.p-band .ledge { flex: none; position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 18px 0 118px; border-bottom: 2px solid var(--ink); }
.p-band .ledge .sel { display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 2px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-band .ledge .lab:last-child { margin-left: auto; white-space: nowrap; }
/* the ledge he stands on turns into a running tape while he reads */
[data-s="reading"] .p-band .ledge { border-bottom: 6px solid; border-image: repeating-linear-gradient(-45deg, var(--ink) 0 12px, var(--yellow) 12px 24px) 6; height: 40px; }
.p-band .greet { padding: 22px 20px 6px; }
.p-band .greet .call::before { content: ""; position: absolute; left: 34px; top: -15px; border: solid transparent; border-width: 0 10px 13px 10px; border-bottom-color: var(--ink); }
.p-band .ask { flex: none; padding: 12px 20px 14px; }
.p-band:has(.log) .ask { border-top: 2px solid var(--ink); }
.p-band .foot9 { flex: none; height: 9px; background: var(--stripe); }
.p-band .now { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 20px 0; }
.p-band .now .bars i { background: var(--ink); }
.p-band .now .lab { color: var(--ink); }

/* =============== 3 · KANITTA: no panel. He walks onto the page and stands on the item the answer rests on =============== */
[data-v="place"]:not([data-s="closed"]) .stack { display: flex; }
[data-v="place"]:is([data-s="reading"], [data-s="answer"]) #pol { width: 66px; height: 63px; top: 182px; left: var(--px, 392px); }
.onpage { display: none; }
[data-v="place"]:is([data-s="reading"], [data-s="answer"]) .onpage { display: block; }
.readtape { position: absolute; left: 390px; top: 266px; width: 518px; height: 6px; background: repeating-linear-gradient(-45deg, var(--ink) 0 12px, var(--yellow) 12px 24px); background-size: 34px 100%; animation: run .7s linear infinite; display: none; }
[data-s="reading"] .readtape { display: block; }
[data-v="place"][data-s="reading"] #pol { animation: patrol 1.7s ease-in-out infinite alternate; }
@keyframes patrol { from { left: 392px; } to { left: 820px; } }
.flag { position: absolute; top: 239px; width: 18px; height: 28px; margin-left: -7px; display: none; place-items: center; background: var(--yellow); box-shadow: inset 0 0 0 1.5px var(--ink); font: 700 13px/1 var(--display); transition: background .12s, color .12s; animation: rise .3s var(--ease) both; }
[data-s="answer"] .flag { display: grid; }
.flag:hover, .flag[aria-current="true"] { background: var(--ink); color: var(--yellow); }
.pcall { position: absolute; top: 281px; width: 440px; display: none; transition: left .6s var(--hop); }
[data-s="answer"] .pcall { display: block; animation: rise .35s var(--ease) .25s both; }
.pcall .call::before { content: ""; position: absolute; left: var(--tail, 60px); top: -15px; border: solid transparent; border-width: 0 10px 13px 10px; border-bottom-color: var(--ink); transition: left .6s var(--hop); }
.pcall .ans { font-size: 14.5px; line-height: 1.5; }
.pcall .ans mark { box-shadow: inset 0 -2px 0 var(--yellow); }
.pcall .here { margin-top: 11px; padding-top: 9px; border-top: 1px solid #3a3d39; }
.pcall .here .h { display: flex; align-items: baseline; gap: 8px; }
.pcall .here b { font: 700 13px var(--text); color: var(--yellow); font-variant-numeric: tabular-nums; }
.pcall .here .f { font-size: 11.5px; color: #a9aca4; }
.pcall .here .q { display: block; margin-top: 3px; font-size: 13.5px; line-height: 1.45; color: #e9e9e2; }
.pcall .nav { display: flex; align-items: center; gap: 4px; margin-top: 11px; }
.pcall .nav .plate[aria-current="true"] { background: #fff; }
.pcall .nav .btn { margin-left: auto; height: 26px; font-size: 10.5px; }
.pcall .nav .btn:hover { background: #fff; color: var(--ink); }
.pcall .foot { margin-top: 8px; font-size: 11.5px; color: #a9aca4; }
/* his place in the corner is kept while he is out on the page */
.spot { position: absolute; left: 1304px; top: 833px; width: 106px; height: 9px; background: var(--stripe); display: none; }
[data-v="place"]:is([data-s="reading"], [data-s="answer"]) .spot { display: block; }
[data-v="place"]:is([data-s="reading"], [data-s="answer"]) .stack .askp::after { display: none; }
</style>
</head>
<body>

<div class="switcher" role="toolbar" aria-label="Design">
  <b>Polier nerede durur</b>
  <button data-set="stay">1 · Yerinde</button>
  <button data-set="band">2 · Bantta</button>
  <button data-set="place">3 · Kanıtta</button>
  <span class="gap"></span>
  <b>Durum</b>
  <button data-state="closed">Kapalı</button>
  <button data-state="invite">Davet (mesaj yok)</button>
  <button data-state="typing">Yazarken</button>
  <button data-state="reading">Okuyor</button>
  <button data-state="answer">Cevap</button>
  <button data-state="none">Bulamadı</button>
  <a href="index.html">← seçilen: Yerinde, panel stilleri</a>
</div>
<div class="note" id="note"></div>

<div class="fit"><div class="board" id="board">
  <img class="bg full" src="bg-full.png" alt="" />
  <img class="bg side" src="bg-side.png" alt="" />

  <!-- 3: what stands on the page itself -->
  <div class="onpage">
    <div class="readtape"></div>
    <div id="flags"></div>
    <div class="pcall" id="pcall"></div>
    <div class="spot"></div>
  </div>

  <!-- 1 -->
  <section class="panel p-stay" aria-label="Ask Polier">
    <header class="head">
      <div class="who"><strong>Polier</strong><span lang="de">Wohnquartier Störwiesen · answers from its 2 documents</span></div>
      <button class="x" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13" /></svg></button></header>
    <div class="log" data-log></div>
    <div class="stand">
      <div class="doing" data-doing></div>
      <form class="askp"><textarea rows="1" placeholder="Ask about the project…" aria-label="Question"></textarea><button class="btn primary" type="submit">Ask</button></form>
    </div>
  </section>

  <!-- 2 -->
  <section class="panel p-band" aria-label="Ask Polier">
    <header class="head">
      <div class="who"><strong>Polier</strong><span>Answers from the documents, with the passage</span></div>
      <button class="x" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13" /></svg></button></header>
    <div class="ledge"><button class="sel" lang="de">Wohnquartier Störwiesen <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 3l4 4 4-4" /></svg></button><span class="lab">2 documents</span></div>
    <div data-band></div>
    <form class="ask"><div class="askp"><textarea rows="1" placeholder="Ask about the project…" aria-label="Question"></textarea><button class="btn primary" type="submit">Ask</button></div></form>
    <div class="foot9"></div>
  </section>

  <!-- 1 and 3: beside Polier in his corner -->
  <div class="stack" id="stack">
    <div data-stack></div>
    <form class="askp"><textarea rows="1" placeholder="Ask about the project…" aria-label="Question"></textarea><button class="btn primary" type="submit">Ask</button></form>
  </div>

  <div id="pol" role="button" aria-label="Polier"><img src="polier.png" alt="" /></div>
</div></div>

<script>
const NOTES = {
  stay: {
    _: "<b>Yerinde.</b> Polier köşesinden ve boyundan hiç vazgeçmez; sohbet onun etrafına kurulur. ",
    closed: "Kapalıyken her zamanki yerinde, tam boy. Tıkla.",
    invite: "Mesaj yokken panel yok: Polier telsiz plakasıyla selam verir, örnek sorular plakanın içinde, senin plakan onun yanında. Sayfa olduğu gibi kalır.",
    typing: "Yazarken plakana doğru eğilir, dinler.",
    reading: "İlk soruyla panel açılır ama Polier aynı noktada kalır: paneldeki 'sahne' onun durduğu yere kurulu. Zemini şerit; okurken şerit akar, o sallanır.",
    answer: "Cevap gelince zıplar. Ne okuduğu ve kaça mal olduğu sahnede, senin plakanın üstünde durur. Dipnota gel: şerit ve alıntı birlikte yanar.",
    none: "Belgede yoksa başını yana eğer; cevap 'belgelerde yok' etiketiyle gelir.",
  },
  band: {
    _: "<b>Bantta.</b> Polier banda çıkar: Engine room ve Partners gibi bantta kendi plakası olur, panel onun altından kepenk gibi iner. ",
    closed: "Kapalıyken köşesinde. Tıkla: banda zıplar.",
    invite: "Mesaj yokken kepenk yarıya kadar iner: selamı, örnek sorular ve senin plakan. Boş, tam boy bir panel hiç görünmez.",
    typing: "Yazarken aşağıya, plakana bakar.",
    reading: "İlk soruyla kepenk yere kadar iner, sayfa yer açar. Üstünde durduğu çizgi okurken akan şerit olur.",
    answer: "Cevap gelince zıplar; konuşma onun altında kayıt gibi birikir. Altta maskot yok, yazı alanı temiz.",
    none: "Belgede yoksa başını yana eğer.",
  },
  place: {
    _: "<b>Kanıtta.</b> Panel yok. Polier sayfaya çıkar ve cevabın dayandığı kalemin üstünde durur: 'where before what' ilkesinin maskotla hali. ",
    closed: "Kapalıyken köşesinde.",
    invite: "Mesaj yokken 1 ile aynı: selam plakası ve senin plakan, köşede.",
    typing: "Yazarken plakana doğru eğilir.",
    reading: "Okurken köşesini bırakır (yeri şeritle tutulur), LV şeridinin üstünde bir uçtan bir uca gezer; şeridin altında bant akar.",
    answer: "Cevabın dayandığı kalemlere sarı bayrak dikilir, Polier birincinin üstünde durur, cevap plakası o kaleme bağlıdır. Bayrağa ya da 1-2-3'e tıkla: oraya zıplar. Yalnızca LV'nin göründüğü sayfalarda çalışır; diğerlerinde 1'e düşer.",
    none: "Belgede yoksa gidecek yer yoktur: köşesine döner, başını eğer, cevabı orada söyler.",
  },
};
// {n}: footnote to passage n; x: where the item stands on the page's strip (the screenshot)
const SEED = [
  { q: "Is dewatering paid as an item of its own?", at: "14:02", found: true,
    a: "No. LV 1 has <mark>no item for dewatering</mark>. The trenches go down to 3.50 m{1}, the soil report expects groundwater from 1.80 m{2}, and the remarks put keeping them dry into the unit prices{3}. Worth a bidder question before 01.12.",
    c: [ { oz: "01.03.0040", at: 26, x: 724, q: "Rohrgraben ausheben, <mark>Tiefe bis 3,50 m</mark>, einschl. Verbau, Boden seitlich lagern" },
         { oz: "01.03.0120", at: 41, x: 826, q: "Rohrleitung PP DN 300 verlegen, <mark>Grundwasserstand</mark> lt. Baugrundgutachten <mark>ca. 1,80 m unter GOK</mark>" },
         { oz: "", at: 0, x: 376, q: "Die <mark>Wasserhaltung</mark> ist <mark>in die Einheitspreise</mark> der Rohrgrabenpositionen <mark>einzurechnen</mark>." } ],
    read: "Read the 14 passages a search found, from 2 of 2 documents", usd: "0.02 USD" },
];
const CANNED = [
  { found: false, a: "The documents do not say who carries the landfill fees. Item 01.02.0090 pays the haulage; a fee is named nowhere.", c: [],
    read: "Read the 9 passages a search found, from 2 of 2 documents", usd: "0.01 USD" },
  { found: true, a: "Two things come from the client: <mark>site power</mark>{1} and the <mark>setting-out of the main axes</mark> by the client's surveyor{2}. Everything else is the contractor's.",
    c: [ { oz: "01.01.0010", at: 1, x: 400, q: "Baustelle einrichten, vorhalten und räumen. <mark>Baustrom wird bauseits gestellt</mark>." },
         { oz: "01.01.0030", at: 3, x: 438, q: "<mark>Absteckung der Hauptachsen erfolgt bauseits</mark> durch den Vermesser des AG, <span class='tok'>[FIRMA_044]</span>" } ],
    read: "Read the 11 passages a search found, from 2 of 2 documents", usd: "0.02 USD" },
];
const Q2 = "Who pays the landfill fees?";
const EXAMPLES = ["Which work does this LV expect from others (bauseits)?", "Is clearing the site paid as an item of its own?", "Welche Leistungen sind in die Einheitspreise einzurechnen?"];
const HELLO = "Ask me about this project. I answer only from its 2 documents and show you the item and the passage. What they do not say, I do not answer.";

let v = "stay", s = "closed", turns = [], k = 0, at = 0, timer = 0, fresh = false;
const $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];
const board = $("#board"), pol = $("#pol");
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const noted = (a, n) => a.replace(/\{(\d)\}/g, (_, d) => `<span class="fn" data-fn="${n}-${d}">${d}</span>`);
const name = (c) => c.oz || "Remarks";
const bars = `<span class="bars"><i></i><i></i><i></i><i></i></span>`;
const SEC = [8, 22, 37];
const strip = (t, n) => {
  const on = new Map(t.c.map((c, i) => [c.at, i + 1]));
  let h = "";
  for (let i = 0; i < 50; i++) h += on.has(i) ? `<i class="on${SEC.includes(i) ? " sec" : ""}" data-fn="${n}-${on.get(i)}">${on.get(i)}</i>` : `<i${SEC.includes(i) ? ' class="sec"' : ""}></i>`;
  return `<div class="strip">${h}</div>`;
};
const last = () => turns[turns.length - 1];
const hello = (tail) => `<div class="call ${tail}"><div class="top">${bars}Polier</div><p>${HELLO}</p><div class="ex">${EXAMPLES.map((q) => `<button data-ex>${esc(q)}</button>`).join("")}</div></div>`;
const notfound = (t) => `<div class="call tail-r rise"><div class="top">${bars}Polier<span>${t.at}</span></div><span class="tag">Not in the project documents</span><p>${t.a}</p><p style="margin-top:8px;font-size:11.5px;color:#a9aca4">${t.read} · ${t.usd}</p></div>`;

function article(t, n) {
  return `<article class="t${fresh && n === turns.length - 1 ? " rise" : ""}"><span class="lab">Question ${n + 1} · ${t.at}</span><h3>${esc(t.q)}</h3>
    ${t.a === undefined ? "" : `
    ${t.c.length ? `<div class="where"><span class="lab"><span>LV 1 · 50 items</span><span>${t.c.length} ${t.c.length === 1 ? "place" : "places"} in the answer</span></span>${strip(t, n)}</div>` : ""}
    ${t.found ? "" : `<span class="tag">Not in the project documents</span>`}
    <p class="ans">${noted(t.a, n)}</p>
    ${t.c.length ? `<div class="cuts">${t.c.map((c, i) => `<button data-fn="${n}-${i + 1}"><span class="fn">${i + 1}</span><span class="h"><b>${name(c)}</b><span class="f">this LV</span></span><span class="q" lang="de">„${c.q}“</span></button>`).join("")}</div>` : ""}
    ${n < turns.length - 1 || v === "band" ? `<p class="foot">${t.read} · ${t.usd}</p>` : ""}`}</article>`;
}

function render() {
  board.dataset.v = v; board.dataset.s = s;
  const talk = ["reading", "answer", "none"].includes(s);
  board.classList.toggle("room", talk && v !== "place");
  const t = last();

  // 1: the panel and the stand
  const log = $("[data-log]"); log.innerHTML = turns.map(article).join(""); log.scrollTop = log.scrollHeight;
  $("[data-doing]").innerHTML = s === "reading" ? `<span class="lab live">${bars}Reading the project documents</span><span>2 documents, 87 items</span>`
    : t && t.a !== undefined ? `<span>${t.read} · ${t.usd}</span><span><u title="about 0.21 USD now, then 0.03 USD a question for an hour">Read every document for this question</u></span>` : "";

  // 2: under the band
  $("[data-band]").outerHTML = talk
    ? `<div class="log" data-band>${turns.map(article).join("")}${s === "reading" ? `<div class="now live">${bars}<span class="lab">Reading the project documents</span></div>` : ""}</div>`
    : `<div class="greet" data-band>${hello("")}</div>`;
  const bl = $(".p-band .log"); if (bl) bl.scrollTop = bl.scrollHeight;

  // 1 and 3: the stack in the corner
  const onpage = v === "place" && (s === "reading" || s === "answer");
  $("[data-stack]").innerHTML = s === "none" && t ? notfound(t)
    : onpage || (v === "place" && talk) ? `<div class="hist"><span class="lab">Asked</span>${turns.map((x, n) => `<button class="plate" title="${esc(x.q)}" aria-current="${n === turns.length - 1}">${n + 1}</button>`).join("")}</div>`
    : hello("tail-r");

  // 3: flags, the plate at the place, Polier on the item
  const cs = v === "place" && s === "answer" && t ? t.c : [];
  at = Math.min(at, Math.max(0, cs.length - 1));
  $("#flags").innerHTML = cs.map((c, i) => `<button class="flag" style="left:${c.x}px" data-go="${i}" aria-current="${i === at}" title="${name(c)}">${i + 1}</button>`).join("");
  if (cs.length) {
    const c = cs[at], left = Math.min(Math.max(c.x - 70, 346), 960);
    pol.style.setProperty("--px", c.x - 31 + "px");
    const pc = $("#pcall"); pc.style.left = left + "px"; pc.style.setProperty("--tail", c.x - left - 9 + "px");
    pc.innerHTML = `<div class="call"><div class="top">${bars}Polier<span>${t.at}</span></div>
      <p class="ans">${noted(t.a, turns.length - 1)}</p>
      <div class="here"><div class="h"><span class="fn lit">${at + 1}</span><b>${name(c)}</b><span class="f">where I stand</span></div><span class="q" lang="de">„${c.q}“</span></div>
      <div class="nav">${cs.map((_, i) => `<button class="plate" data-go="${i}" aria-current="${i === at}">${i + 1}</button>`).join("")}<button class="btn primary" type="button">Open the item</button></div>
      <p class="foot">${t.read} · ${t.usd}</p></div>`;
  } else pol.style.removeProperty("--px");

  $$("[data-set]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.set === v));
  $$("[data-state]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.state === s));
  $("#note").innerHTML = NOTES[v]._ + NOTES[v][s];
  history.replaceState(null, "", `#${v}/${s}`);
  fresh = false;
}

// a state picked in the switcher: the conversation it stands for
function state(to) {
  clearTimeout(timer); s = to; at = 0; k = 0;
  const one = structuredClone(SEED[0]);
  turns = to === "reading" ? [{ q: one.q, at: one.at }] : to === "answer" ? [one] : to === "none" ? [one, { q: Q2, at: "14:06", ...CANNED[0] }] : [];
  if (to === "none") k = 1;
  $$("textarea").forEach((ta) => (ta.value = to === "typing" ? SEED[0].q.slice(0, 24) : ""));
  render();
}
const time = () => new Date().toTimeString().slice(0, 5);
function ask(q) {
  q = q.trim();
  if (!q || s === "reading") return;
  $$("textarea").forEach((ta) => (ta.value = ""));
  turns.push({ q, at: time() }); s = "reading"; fresh = true; render();
  timer = setTimeout(() => {
    const a = turns.length === 1 ? SEED[0] : CANNED[k++ % CANNED.length];
    Object.assign(last(), structuredClone({ ...a, q: last().q, at: last().at }));
    s = a.found ? "answer" : "none"; at = 0; fresh = true; render();
  }, 2400);
}
$$("form").forEach((f) => {
  const ta = $("textarea", f);
  f.onsubmit = (e) => { e.preventDefault(); ask(ta.value); };
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } };
  ta.oninput = () => { if ((s === "invite" || s === "typing") && s !== (ta.value ? "typing" : "invite")) { s = ta.value ? "typing" : "invite"; board.dataset.s = s; $$("[data-state]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.state === s)); $("#note").innerHTML = NOTES[v]._ + NOTES[v][s]; } };
});
pol.onclick = () => state(s === "closed" ? "invite" : "closed");
document.addEventListener("click", (e) => {
  const ex = e.target.closest("[data-ex]"), go = e.target.closest("[data-go]");
  if (ex) ask(ex.textContent);
  if (go) { at = +go.dataset.go; render(); }
  if (e.target.closest("[data-close]")) state("closed");
});
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-fn]");
  $$(".lit:not(.here .fn)").forEach((x) => x.classList.remove("lit"));
  if (!el) return;
  $$(`[data-fn="${el.dataset.fn}"]`).forEach((x) => { x.classList.add("lit"); if (x.tagName === "BUTTON") $(".fn", x)?.classList.add("lit"); });
});
$$("[data-set]").forEach((b) => (b.onclick = () => { v = b.dataset.set; state(s); }));
$$("[data-state]").forEach((b) => (b.onclick = () => state(b.dataset.state)));
const ORDER = ["closed", "invite", "typing", "reading", "answer", "none"], VS = ["stay", "band", "place"];
addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (VS[+e.key - 1]) { v = VS[+e.key - 1]; state(s); }
  if (e.key === "ArrowRight") state(ORDER[Math.min(ORDER.indexOf(s) + 1, 5)]);
  if (e.key === "ArrowLeft") state(ORDER[Math.max(ORDER.indexOf(s) - 1, 0)]);
});
const fit = () => { const r = $(".fit").getBoundingClientRect(), z = Math.min(r.width / 1440, r.height / 860); board.style.transform = `translateX(${Math.max(0, (r.width - 1440 * z) / 2)}px) scale(${z})`; };
addEventListener("resize", fit); fit();
const [hv, hs] = location.hash.slice(1).split("/");
if (VS.includes(hv)) v = hv;
state(ORDER.includes(hs) ? hs : "invite");
</script>
</body>
</html>
